<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
<title>Conquered Time — Reports</title>
<link rel="stylesheet" href="../styles/design-system.css">
<script src="theme-init.js"></script>
<style>
  /* ── Tabs ── */
  .tab-bar {
    display: flex;
    gap: 2px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 4px;
    margin-bottom: 16px;
    width: fit-content;
    flex-shrink: 0;
  }
  .tab-btn {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    background: transparent;
    border: none;
    border-radius: var(--radius);
    padding: 7px 20px;
    cursor: pointer;
    transition: all var(--transition);
  }
  .tab-btn:hover  { color: var(--text-bright); background: var(--surface-2); }
  .tab-btn.active { color: var(--text-white);  background: var(--accent); }

  /* ── Filter bar ── */
  .filter-bar {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 18px;
    display: flex;
    gap: 14px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 12px;
    box-shadow: var(--shadow-1), var(--shadow-inset);
    flex-shrink: 0;
  }
  .filter-field { display: flex; flex-direction: column; gap: 4px; }
  .filter-field label {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .filter-field select, .filter-field input { min-width: 140px; font-size: 12px; }

  /* ── Summary chips ── */
  .summary-chips {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .summary-chip {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 130px;
    box-shadow: var(--shadow-1), var(--shadow-inset);
    position: relative;
  }
  .summary-chip::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: var(--accent);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    opacity: 0.5;
  }
  .summary-chip.violet::before { background: var(--accent-2); }
  .summary-chip.yellow::before { background: var(--yellow); }
  .summary-chip.green::before  { background: var(--green); }
  .chip-label {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .chip-value {
    font-family: var(--mono);
    font-size: 22px;
    color: var(--text-white);
    letter-spacing: -0.02em;
  }
  .chip-sub { font-family: var(--sans); font-size: 11px; color: var(--text-dim); }

  /* ── Period grid ── */
  .period-grid {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 12px;
    flex: 1;
    min-height: 0;
  }

  /* ── Bar chart ── */
  .bar-chart-wrap {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    box-shadow: var(--shadow-1), var(--shadow-inset);
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }
  .panel-title {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-bright);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }
  .bar-svg-wrap { flex: 1; min-height: 0; overflow: hidden; }
  #bar-svg { width: 100%; height: 100%; display: block; }

  /* ── Label breakdown ── */
  .breakdown-panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    box-shadow: var(--shadow-1), var(--shadow-inset);
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-light) transparent;
  }
  .label-row { display: flex; flex-direction: column; gap: 4px; }
  .label-row-hdr { display: flex; justify-content: space-between; align-items: baseline; }
  .label-name  { font-family: var(--sans);  font-size: 12px; font-weight: 500; color: var(--text-bright); }
  .label-hours { font-family: var(--mono);  font-size: 12px; color: var(--yellow); }
  .label-track { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .label-fill  { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s ease; }
  .label-pct   { font-family: var(--mono);  font-size: 10px; color: var(--text-dim); }

  /* ── Company cards ── */
  .company-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 14px;
    align-content: start;
  }
  .company-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    box-shadow: var(--shadow-1), var(--shadow-inset);
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .company-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: var(--accent);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    opacity: 0.6;
  }
  /* D-006: long names/hierarchies clamp to 2 lines instead of stretching the card */
  .cc-name { font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--text-white);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .cc-hier { font-family: var(--mono); font-size: 10px; color: var(--text-muted); margin-top: 1px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .cc-stats { display: flex; gap: 20px; }
  .cc-stat  { display: flex; flex-direction: column; gap: 2px; }
  .cc-stat-val {
    font-family: var(--mono);
    font-size: 18px;
    color: var(--yellow);
  }
  .cc-stat-lbl {
    font-family: var(--sans);
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .cc-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .cc-chip {
    font-family: var(--sans);
    font-size: 10px;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 2px 7px;
  }
  .cc-chip span { font-family: var(--mono); color: var(--accent); font-size: 10px; }

  /* ── Audit flags ── */
  .audit-flag {
    display: inline-flex;
    align-items: center;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
  }
  .flag-ok        { background: var(--green-dim);  color: var(--green);  border: 1px solid rgba(16,185,129,0.3); }
  .flag-warn      { background: var(--yellow-dim); color: var(--yellow); border: 1px solid rgba(245,158,11,0.3); }
  .flag-error     { background: var(--red-dim);    color: var(--red);    border: 1px solid rgba(239,68,68,0.3); }
  .flag-info      { background: var(--blue-dim);   color: var(--blue);   border: 1px solid rgba(96,165,250,0.3); }
  .flag-dismissed { background: var(--surface-2);  color: var(--text-muted); border: 1px solid var(--border-light); }

  .audit-toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
    flex-shrink: 0;
  }
  .audit-toolbar-label { font-family: var(--sans); font-size: 12px; color: var(--text-muted); margin-right: auto; }
  .audit-action-btn {
    padding: 5px 12px;
    font-family: var(--sans); font-size: 11px; font-weight: 500;
    border: 1px solid var(--border-light); border-radius: var(--radius);
    background: transparent; color: var(--text-muted); cursor: pointer;
    transition: all var(--transition);
  }
  .audit-action-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .audit-action-btn.danger:hover { border-color: var(--yellow); color: var(--yellow); background: var(--yellow-dim); }
  .audit-action-btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  .audit-row-btn {
    padding: 3px 8px;
    font-family: var(--sans); font-size: 10px; font-weight: 500;
    border: 1px solid var(--border-light); border-radius: var(--radius-sm);
    background: transparent; cursor: pointer; transition: all var(--transition);
    white-space: nowrap;
    color: var(--text-muted); /* base fallback — a variant without a color rule must never fall to UA black (D-001) */
  }
  .audit-row-btn.dismiss { color: var(--text-muted); }
  .audit-row-btn.dismiss:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .audit-row-btn.fix { color: var(--green); border-color: rgba(16,185,129,0.4); }
  .audit-row-btn.fix:hover { background: var(--green-dim); }
  .audit-row-btn.email { color: var(--blue); border-color: rgba(96,165,250,0.4); }
  .audit-row-btn.email:hover { background: var(--blue-dim); }
  .audit-suggest {
    font-family: var(--sans); font-size: 10px; color: var(--text-muted);
    font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 200px;
  }
  tr.audit-dismissed-row td { opacity: 0.7; }

  /* ── Tab panels ── */
  .tab-panel { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .tab-panel.active { display: flex; }

  .scroll-area {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-light) transparent;
  }

  .empty-state {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    padding: 40px 0;
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title-block">
    <div class="page-eyebrow">Analytics</div>
    <div class="page-title">Reports</div>
  </div>
  <div class="page-actions">
    <button class="btn-neutral" id="btn-export-pdf">Export PDF</button>
    <button class="btn-neutral" id="btn-export-csv" style="display:none;">Export CSV</button>
    <button class="btn-neutral" id="btn-email-report" style="display:none;">Email Report</button>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="period">Period Summary</button>
  <button class="tab-btn" data-tab="company">Company Breakdown</button>
  <button class="tab-btn" data-tab="audit">Audit Log</button>
</div>

<!-- ── Period Summary ── -->
<div id="tab-period" class="tab-panel active">
  <div class="filter-bar">
    <div class="filter-field">
      <label>From</label>
      <input type="date" id="period-from">
    </div>
    <div class="filter-field">
      <label>To</label>
      <input type="date" id="period-to">
    </div>
    <div class="filter-field">
      <label>Company</label>
      <select id="period-company">
        <option value="">All Companies</option>
      </select>
    </div>
    <button class="btn-primary" id="btn-apply">Apply</button>
  </div>

  <div class="summary-chips" id="period-chips"></div>

  <div class="period-grid">
    <div class="bar-chart-wrap">
      <div class="panel-title">Daily Hours</div>
      <div class="bar-svg-wrap" id="bar-svg-wrap">
        <svg id="bar-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
    <div class="breakdown-panel" id="label-breakdown">
      <div class="panel-title">Task Breakdown</div>
    </div>
  </div>
</div>

<!-- ── Company Breakdown ── -->
<div id="tab-company" class="tab-panel">
  <div class="scroll-area" style="padding-bottom:8px;">
    <div class="company-cards" id="company-cards"></div>
  </div>
</div>

<!-- ── Audit Log ── -->
<div id="tab-audit" class="tab-panel">
  <div class="audit-toolbar">
    <span class="audit-toolbar-label" id="audit-count-label">Loading…</span>
    <button class="audit-action-btn" id="btn-review-wizard" disabled>Review Discrepancies</button>
    <button class="audit-action-btn" id="btn-toggle-dismissed">Show Dismissed</button>
    <button class="audit-action-btn danger" id="btn-clear-dismissed">Clear All Dismissed</button>
  </div>
  <div class="table-wrap scroll-area">
    <table id="audit-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Company</th>
          <th>Task Label</th>
          <th>Clock In</th>
          <th>Clock Out</th>
          <th class="center">Duration</th>
          <th class="center">Status</th>
          <th>Suggestion</th>
          <th class="center">Actions</th>
        </tr>
      </thead>
      <tbody id="audit-tbody"></tbody>
    </table>
  </div>
</div>

<script src="../components/settings.js"></script>
<script src="../components/about.js"></script>
<script src="../components/shell.js"></script>
<script src="../row-utils.js"></script>
<script src="reports.js"></script>
</body>
</html>
