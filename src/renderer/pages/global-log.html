<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
<title>Conquered Time — Global Log</title>
<link rel="stylesheet" href="../styles/design-system.css">
<script src="theme-init.js"></script>
<style>
  .filter-bar {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 18px;
    display: flex;
    gap: 14px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 16px;
    box-shadow: var(--shadow-1), var(--shadow-inset);
  }
  .filter-field { display: flex; flex-direction: column; gap: 4px; }
  .filter-field label {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .filter-field select,
  .filter-field input { min-width: 150px; font-size: 12px; }

  /* Summary chips */
  .summary-chips {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .summary-chip {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px 18px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 130px;
    box-shadow: var(--shadow-1), var(--shadow-inset);
  }
  .chip-label {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
  }
  .chip-value {
    font-family: var(--mono);
    font-size: 20px;
    color: var(--text-white);
    letter-spacing: -0.02em;
  }

  /* Table cells */
  .log-company {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
  }
  .log-date {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .log-session { font-family: var(--sans); font-size: 12px; color: var(--text); }
  .log-hours   { font-family: var(--mono); font-size: 13px; color: var(--yellow); text-align: right; white-space: nowrap; }
  .log-actions { display: flex; gap: 6px; justify-content: flex-end; }

  .btn-xs {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: 1px solid var(--border-light);
    background: transparent;
    color: var(--text-muted);
    transition: all var(--transition);
  }
  .btn-xs:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* Expandable detail */
  .detail-row { display: none; background: var(--surface-2); }
  .detail-row.open { display: table-row; }
  .detail-inner { padding: 10px 16px; }
  .detail-task {
    display: flex;
    gap: 14px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .detail-task:last-child { border-bottom: none; }
  .detail-task-label {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    min-width: 90px;
  }
  .detail-task-name { flex: 1; font-family: var(--sans); font-size: 12px; color: var(--text); }
  .detail-task-time { font-family: var(--mono); font-size: 11px; color: var(--text-muted); min-width: 100px; }
  .detail-task-dur  { font-family: var(--mono); font-size: 11px; color: var(--yellow); min-width: 60px; text-align: right; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--text-dim);
  }

  .expand-arrow { color: var(--text-dim); font-size: 10px; cursor: pointer; }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title-block">
    <div class="page-eyebrow">History</div>
    <div class="page-title">Global Log</div>
  </div>
  <div class="page-actions">
    <button class="btn-neutral" id="btn-export-csv">Export CSV</button>
    <button class="btn-neutral" id="btn-export-pdf">Export PDF</button>
  </div>
</div>

<!-- Filters -->
<div class="filter-bar">
  <div class="filter-field">
    <label>Company</label>
    <select id="filter-company">
      <option value="">All Companies</option>
    </select>
  </div>
  <div class="filter-field">
    <label>From</label>
    <input type="date" id="filter-from">
  </div>
  <div class="filter-field">
    <label>To</label>
    <input type="date" id="filter-to">
  </div>
  <div class="filter-field">
    <label>Quick Range</label>
    <select id="filter-range">
      <option value="">Custom</option>
      <option value="7">Last 7 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="365">This year</option>
      <option value="all">All time</option>
    </select>
  </div>
  <button class="btn-neutral" id="btn-clear-filters">Clear</button>
</div>

<!-- Summary chips -->
<div class="summary-chips">
  <div class="summary-chip">
    <div class="chip-label">Sessions</div>
    <div class="chip-value" id="chip-sessions">—</div>
  </div>
  <div class="summary-chip">
    <div class="chip-label">Total Hours</div>
    <div class="chip-value" id="chip-hours">—</div>
  </div>
  <div class="summary-chip">
    <div class="chip-label">Companies</div>
    <div class="chip-value" id="chip-companies">—</div>
  </div>
  <div class="summary-chip">
    <div class="chip-label">Avg / Session</div>
    <div class="chip-value" id="chip-avg">—</div>
  </div>
</div>

<!-- Log table -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:24px;"></th>
        <th style="min-width:140px;">Company</th>
        <th style="min-width:100px;">Date</th>
        <th>Session</th>
        <th style="min-width:80px;text-align:right;">Hours</th>
        <th style="min-width:110px;text-align:right;">Actions</th>
      </tr>
    </thead>
    <tbody id="log-tbody"></tbody>
  </table>
</div>

<div style="margin-top:10px;font-family:var(--sans);font-size:11px;color:var(--text-dim);text-align:right;" id="row-count"></div>

<script src="../components/settings.js"></script>
<script src="../components/shell.js"></script>
<script src="../row-utils.js"></script>
<script src="pdf-fonts.js"></script>
<script src="global-log.js"></script>
</body>
</html>
