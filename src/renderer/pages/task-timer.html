<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
<title>Conquered Time — Dispatch</title>
<link rel="stylesheet" href="../styles/design-system.css">
<script src="theme-init.js"></script>
</head>
<body>

<!-- ── Active session banner ── -->
<div class="tt-session-banner no-session" id="session-banner">
  <div class="tt-session-field">
    <div class="tt-session-label">Company</div>
    <div class="tt-session-value" id="banner-company">—</div>
  </div>
  <div class="tt-session-field">
    <div class="tt-session-label">Date</div>
    <div class="tt-session-value" id="banner-date">—</div>
  </div>
  <div class="tt-session-field">
    <div class="tt-session-label">Clocked In</div>
    <div class="tt-session-value" id="banner-clock-in">—</div>
  </div>
  <div class="tt-session-field">
    <div class="tt-session-label">Session</div>
    <div class="tt-session-value" id="banner-duration">—</div>
  </div>
  <div style="margin-left:auto;">
    <div class="tt-live-badge" id="live-badge" style="display:none;">
      <div class="tt-live-dot"></div>LIVE
    </div>
  </div>
</div>

<!-- ── No-session fallback ── -->
<div class="tt-no-session" id="no-session-msg" style="display:none;">
  <strong>No active punch</strong>
  Clock in from Time Tracker first, then return here to log tasks.
</div>

<!-- ── Main body (hidden until session confirmed) ── -->
<div class="tt-body" id="tt-main" style="display:none;">

  <!-- Left: input panel -->
  <div class="tt-input-panel">
    <div class="tt-panel-title">Log a Task</div>

    <input type="text" id="task-label-input" class="tt-label-input"
           placeholder="Task name — pick from your session or type one" autocomplete="off"
           list="recent-labels-list"
           data-tip="Type a task or pick one from your active session — Start times it, and the logged duration is written back into that row's Description." data-tip-pos="bottom">
    <datalist id="recent-labels-list"></datalist>

    <div class="tt-quickpick-row" id="quickpick-row"></div>

    <div class="tt-stopwatch" id="stopwatch">00:00</div>

    <div class="tt-timer-btns">
      <button class="tt-btn-start" id="btn-start">▶ Start Task</button>
      <button class="tt-btn-stop"  id="btn-stop"  style="display:none;">■ Stop &amp; Log</button>
      <button class="tt-btn-cancel" id="btn-cancel" style="display:none;">✕</button>
    </div>

    <!-- Pomodoro cycle (hidden unless the profile's Break Style is Pomodoro) -->
    <div class="pomo-panel" id="pomo-panel" style="display:none;">
      <div class="tt-panel-title">Pomodoro</div>
      <div class="pomo-readout">
        <div class="pomo-phase" id="pomo-phase">Idle</div>
        <div class="pomo-countdown" id="pomo-countdown">25:00</div>
        <div class="pomo-cycles" id="pomo-cycles"></div>
      </div>
      <div class="pomo-btns">
        <button class="btn-primary" id="pomo-start" data-tip="Begin a focus block — you'll get a break alert when it ends.">▶ Start</button>
        <button class="btn-neutral" id="pomo-pause" style="display:none;">⏸ Pause</button>
        <button class="btn-neutral" id="pomo-skip"  style="display:none;" data-tip="Jump to the next phase without an alert.">⏭ Skip Phase</button>
        <button class="btn-neutral" id="pomo-stop"  style="display:none;">■ Reset</button>
      </div>
      <div class="pomo-hint" id="pomo-hint"></div>
    </div>
  </div>

  <!-- Right: task log panel -->
  <div class="tt-log-panel">
    <div class="tt-panel-title">Session Task Log</div>

    <div class="tt-task-list" id="task-list">
      <!-- populated by JS -->
    </div>

    <div class="tt-counter-chip" id="counter-chip">
      <span class="tt-counter-num" id="counter-num">0</span>
      <span>tasks completed this session</span>
    </div>

    <div class="tt-desc-preview" id="desc-preview" style="display:none;">
      <div style="margin-bottom:3px;">→ Written to Time Tracker description:</div>
      <span id="desc-preview-text"></span>
    </div>
  </div>
</div>

<script src="../components/settings.js"></script>
<script src="../components/about.js"></script>
<script src="../components/shell.js"></script>
<script src="task-timer.js"></script>
</body>
</html>
