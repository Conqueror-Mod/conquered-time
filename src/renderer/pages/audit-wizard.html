<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Conquered Time — Audit Wizard</title>
<link rel="stylesheet" href="../styles/design-system.css">
<script>
  (function(){
    const params = new URLSearchParams(window.location.search);
    const t = params.get('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.visibility = 'hidden';
  })();
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 680px; height: 520px;
    overflow: hidden;
    background: var(--surface-0);
    color: var(--text-bright);
    font-family: var(--sans);
  }

  /* ── Titlebar ── */
  .wizard-titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    height: 36px;
    background: var(--surface-1);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
    flex-shrink: 0;
    user-select: none;
  }
  .titlebar-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .titlebar-close {
    -webkit-app-region: no-drag;
    width: 22px; height: 22px;
    border: none; border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-dim);
    font-size: 14px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .titlebar-close:hover { background: var(--red-dim); color: var(--red); }

  /* ── Body layout ── */
  .wizard-body {
    display: flex;
    flex-direction: column;
    height: calc(520px - 36px);
    padding: 20px 24px 16px;
    gap: 16px;
  }

  /* ── Progress header ── */
  .wizard-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .wizard-mode-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-white);
  }
  .wizard-counter {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ── Progress bar ── */
  .wizard-progress-track {
    height: 3px;
    background: var(--surface-2);
    border-radius: 2px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .wizard-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  /* ── Issue card ── */
  .issue-card {
    flex: 1;
    min-height: 0;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    box-shadow: var(--shadow-2), var(--shadow-inset);
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }
  .issue-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  }
  .issue-card.flag-error::before  { background: var(--red); }
  .issue-card.flag-warn::before   { background: var(--yellow); }
  .issue-card.flag-info::before   { background: var(--blue); }
  .issue-card.flag-ok::before     { background: var(--green); }

  .issue-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .issue-badge {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
  }
  .issue-badge.flag-error  { background: var(--red-dim);    color: var(--red);    border: 1px solid rgba(239,68,68,0.3); }
  .issue-badge.flag-warn   { background: var(--yellow-dim); color: var(--yellow); border: 1px solid rgba(245,158,11,0.3); }
  .issue-badge.flag-info   { background: var(--blue-dim);   color: var(--blue);   border: 1px solid rgba(96,165,250,0.3); }

  .issue-date   { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
  .issue-company { font-size: 12px; font-weight: 500; color: var(--accent); }

  .issue-detail {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .detail-field { display: flex; flex-direction: column; gap: 3px; }
  .detail-label {
    font-size: 9px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .detail-value {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-bright);
  }
  .detail-value.task-label {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-white);
  }

  .suggestion-block {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .suggestion-label {
    font-size: 9px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .suggestion-text {
    font-size: 12px;
    color: var(--text-bright);
    font-style: italic;
  }

  /* ── Action footer ── */
  .wizard-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .wizard-footer .spacer { flex: 1; }

  .btn-wiz-primary {
    padding: 8px 20px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: opacity var(--transition);
  }
  .btn-wiz-primary:hover { opacity: 0.88; }

  .btn-wiz-secondary {
    padding: 8px 16px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all var(--transition);
  }
  .btn-wiz-secondary:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .btn-wiz-done {
    padding: 8px 16px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all var(--transition);
    margin-left: 4px;
  }
  .btn-wiz-done:hover { border-color: var(--text-muted); color: var(--text-muted); }

  /* ── Completion screen ── */
  .completion-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
  }
  .completion-icon { font-size: 40px; line-height: 1; }
  .completion-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-white);
  }
  .completion-sub {
    font-size: 12px;
    color: var(--text-muted);
    max-width: 300px;
    line-height: 1.5;
  }
  .btn-wiz-close-final {
    margin-top: 8px;
    padding: 9px 28px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: opacity var(--transition);
  }
  .btn-wiz-close-final:hover { opacity: 0.88; }

  /* ── Loading / empty states ── */
  .wizard-loading {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<div class="wizard-titlebar">
  <span class="titlebar-title" id="titlebar-label">Audit Wizard</span>
  <button class="titlebar-close" id="btn-titlebar-close" title="Close">✕</button>
</div>

<div class="wizard-body" id="wizard-body">
  <div class="wizard-loading">Loading issues…</div>
</div>

<script src="../components/settings.js"></script>
<script>
  const params   = new URLSearchParams(window.location.search);
  const mode     = params.get('mode') || 'fix';
  const isFix    = mode === 'fix';

  let issues  = [];
  let current = 0;
  let acted   = 0; // issues acted on (applied or acknowledged — not skipped)

  // ── Audit logic (mirrors reports.html) ──────────────────────────────────
  function getAuditType(r) {
    if (!r.clock_in)        return 'no_clock_in';
    if (!r.clock_out)       return 'no_clock_out';
    if (!r.total_mins)      return 'zero_duration';
    if (r.total_mins > 720) return 'over_12h';
    return 'ok';
  }

  function auditMeta(type, r) {
    switch (type) {
      case 'no_clock_in':   return { flag: '⚠ No clock-in',    cls: 'flag-error', suggestion: 'Enter a clock-in time in the Time Tracker.',             fix: null };
      case 'no_clock_out':  return { flag: '● No clock-out',    cls: 'flag-error', suggestion: 'Auto-set clock-out to clock-in + 8h.',                   fix: 'set_clock_out' };
      case 'zero_duration': return { flag: '⚠ Zero duration',   cls: 'flag-warn',  suggestion: 'Recalculate duration from clock-in / clock-out.',         fix: (r.clock_in && r.clock_out) ? 'recalc_duration' : null };
      case 'over_12h':      return { flag: '⚠ Over 12h',        cls: 'flag-warn',  suggestion: 'Review clock-out — session exceeds 12 hours.',            fix: null };
      case 'missing_break': return { flag: '⚠ No break logged', cls: 'flag-warn',  suggestion: 'Log a break in Dispatch for sessions over 4 hours.',      fix: null };
      case 'missing_lunch': return { flag: '⚠ No lunch logged', cls: 'flag-warn',  suggestion: 'Log a lunch in Dispatch for sessions over 6 hours.',      fix: null };
      default:              return { flag: '✓ OK',               cls: 'flag-ok',    suggestion: '',                                                        fix: null };
    }
  }

  // ── Load data and build issue list ──────────────────────────────────────
  window.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('titlebar-label').textContent = isFix ? 'Suggest Discrepancy Fix' : 'Acknowledge Discrepancies';
    document.getElementById('btn-titlebar-close').addEventListener('click', () => window.close());

    // Apply settings (scale only — theme already set via query param)
    if (typeof Settings !== 'undefined') {
      const s = await api.invoke('settings:get');
      if (s?.scale) document.documentElement.setAttribute('data-scale', s.scale);
    }

    const [allEntries, dismissedRows] = await Promise.all([
      api.invoke('entries:all'),
      api.invoke('audit:get-dismissed')
    ]);

    const entries     = allEntries    || [];
    const dismissed   = dismissedRows || [];
    const dismissedSet = new Set(dismissed.map(d => `${d.entry_id}:${d.row_idx}:${d.type}`));

    // Build companies map for display
    const companies = await api.invoke('companies:list') || [];
    const companyMap = {};
    companies.forEach(c => { companyMap[Number(c.id)] = c; });

    entries.forEach(e => {
      const co      = companyMap[Number(e.company_id)];
      const entryId = Number(e.id);
      try {
        JSON.parse(e.rows_json || '[]').forEach((r, idx) => {
          if (!r.clock_in && !r.clock_out && !r.label && !r.name) return;
          const type = getAuditType(r);
          if (type === 'ok') return;
          const dKey = `${entryId}:${idx}:${type}`;
          if (dismissedSet.has(dKey)) return;
          issues.push({ date: e.log_date, company: co?.name || `#${e.company_id}`, entryId, rowIdx: idx, type, dKey, r });
        });
      } catch {}

      const totalMins = Number(e.total_mins || 0);
      if (totalMins > 240) {
        const bKey = `${entryId}:-1:missing_break`;
        if (!dismissedSet.has(bKey))
          issues.push({ date: e.log_date, company: co?.name || `#${e.company_id}`, entryId, rowIdx: -1, type: 'missing_break', dKey: bKey, r: { clock_in: '—', clock_out: '—', total_mins: totalMins, label: '(session)' } });
      }
      if (totalMins > 360) {
        const lKey = `${entryId}:-1:missing_lunch`;
        if (!dismissedSet.has(lKey))
          issues.push({ date: e.log_date, company: co?.name || `#${e.company_id}`, entryId, rowIdx: -1, type: 'missing_lunch', dKey: lKey, r: { clock_in: '—', clock_out: '—', total_mins: totalMins, label: '(session)' } });
      }
    });

    issues.sort((a, b) => b.date !== a.date ? b.date.localeCompare(a.date) : (a.r.clock_in || '').localeCompare(b.r.clock_in || ''));

    document.documentElement.style.visibility = '';
    renderStep();
  });

  // ── Render current step ──────────────────────────────────────────────────
  function renderStep() {
    const body = document.getElementById('wizard-body');

    if (!issues.length) {
      body.innerHTML = `
        <div class="completion-screen">
          <div class="completion-icon">✓</div>
          <div class="completion-title">No active discrepancies</div>
          <div class="completion-sub">All audit issues have already been addressed.</div>
          <button class="btn-wiz-close-final" id="btn-final-close">Close</button>
        </div>`;
      document.getElementById('btn-final-close').addEventListener('click', () => window.close());
      return;
    }

    if (current >= issues.length) {
      renderCompletion();
      return;
    }

    const { date, company, type, r } = issues[current];
    const { flag, cls, suggestion, fix } = auditMeta(type, r);
    const total = issues.length;

    const showFix    = isFix && fix !== null;
    const pct        = Math.round((current / total) * 100);

    body.innerHTML = `
      <div class="wizard-header">
        <div class="wizard-mode-title">${isFix ? 'Suggest Discrepancy Fix' : 'Acknowledge Discrepancies'}</div>
        <div class="wizard-counter">Issue ${current + 1} of ${total}</div>
      </div>

      <div class="wizard-progress-track">
        <div class="wizard-progress-fill" style="width:${pct}%"></div>
      </div>

      <div class="issue-card ${cls}">
        <div class="issue-meta">
          <span class="issue-badge ${cls}">${flag}</span>
          <span class="issue-date">${date}</span>
          <span class="issue-company">${company}</span>
        </div>

        <div class="issue-detail">
          <div class="detail-field">
            <div class="detail-label">Task Label</div>
            <div class="detail-value task-label">${r.label || '—'}</div>
          </div>
          <div class="detail-field">
            <div class="detail-label">Task Name</div>
            <div class="detail-value task-label">${r.name || '—'}</div>
          </div>
          <div class="detail-field">
            <div class="detail-label">Clock In</div>
            <div class="detail-value">${r.clock_in || '—'}</div>
          </div>
          <div class="detail-field">
            <div class="detail-label">Clock Out</div>
            <div class="detail-value">${r.clock_out || '—'}</div>
          </div>
        </div>

        ${suggestion ? `
        <div class="suggestion-block">
          <div class="suggestion-label">${isFix ? 'Suggested Fix' : 'Note'}</div>
          <div class="suggestion-text">${suggestion}</div>
        </div>` : ''}
      </div>

      <div class="wizard-footer">
        ${showFix ? `<button class="btn-wiz-primary" id="btn-apply-fix">Apply Fix</button>` : ''}
        <button class="btn-wiz-${isFix && !showFix ? 'primary' : 'secondary'}" id="btn-acknowledge">${isFix ? 'Acknowledge' : 'Acknowledge'}</button>
        <button class="btn-wiz-secondary" id="btn-skip">Skip</button>
        <div class="spacer"></div>
        <button class="btn-wiz-done" id="btn-done">Done</button>
      </div>`;

    if (showFix) {
      document.getElementById('btn-apply-fix').addEventListener('click', applyFix);
    }
    document.getElementById('btn-acknowledge').addEventListener('click', acknowledge);
    document.getElementById('btn-skip').addEventListener('click', skip);
    document.getElementById('btn-done').addEventListener('click', () => window.close());
  }

  // ── Actions ──────────────────────────────────────────────────────────────
  async function applyFix() {
    const issue = issues[current];
    const { fix } = auditMeta(issue.type, issue.r);
    if (!fix) return;
    const res = await api.invoke('audit:apply-fix', { entry_id: issue.entryId, row_idx: issue.rowIdx, fix_type: fix });
    if (res?.ok) {
      // Auto-acknowledge after successful fix
      await api.invoke('audit:dismiss', { entry_id: issue.entryId, row_idx: issue.rowIdx, type: issue.type });
      acted++;
    }
    advance();
  }

  async function acknowledge() {
    const issue = issues[current];
    await api.invoke('audit:dismiss', { entry_id: issue.entryId, row_idx: issue.rowIdx, type: issue.type });
    acted++;
    advance();
  }

  function skip() {
    advance();
  }

  function advance() {
    current++;
    renderStep();
  }

  // ── Completion ───────────────────────────────────────────────────────────
  function renderCompletion() {
    const body   = document.getElementById('wizard-body');
    const skipped = issues.length - acted;
    body.innerHTML = `
      <div class="completion-screen">
        <div class="completion-icon">✓</div>
        <div class="completion-title">All done</div>
        <div class="completion-sub">
          ${acted} issue${acted !== 1 ? 's' : ''} resolved${skipped > 0 ? `, ${skipped} skipped` : ''}.
          The audit log will refresh when you close this window.
        </div>
        <button class="btn-wiz-close-final" id="btn-final-close">Close</button>
      </div>`;
    document.getElementById('btn-final-close').addEventListener('click', () => window.close());
  }
</script>
</body>
</html>
