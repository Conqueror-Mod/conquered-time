<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
<title>Conquered Time — Audit Wizard</title>
<link rel="stylesheet" href="../styles/design-system.css">
<script src="audit-theme-init.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 680px; height: 520px;
    overflow: hidden;
    background: var(--surface-0);
    color: var(--text-bright);
    font-family: var(--sans);
  }

  /* ── Titlebar ── */
  .wizard-titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    height: 36px;
    background: var(--surface-1);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
    flex-shrink: 0;
    user-select: none;
  }
  .titlebar-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .titlebar-close {
    -webkit-app-region: no-drag;
    width: 22px; height: 22px;
    border: none; border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-dim);
    font-size: 14px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .titlebar-close:hover { background: var(--red-dim); color: var(--red); }

  /* ── Body layout ── */
  .wizard-body {
    display: flex;
    flex-direction: column;
    height: calc(520px - 36px);
    padding: 20px 24px 16px;
    gap: 16px;
  }

  /* ── Progress header ── */
  .wizard-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .wizard-mode-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-white);
  }
  .wizard-counter {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ── Progress bar ── */
  .wizard-progress-track {
    height: 3px;
    background: var(--surface-2);
    border-radius: 2px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .wizard-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  /* ── Issue card ── */
  .issue-card {
    flex: 1;
    min-height: 0;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    box-shadow: var(--shadow-2), var(--shadow-inset);
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }
  .issue-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  }
  .issue-card.flag-error::before  { background: var(--red); }
  .issue-card.flag-warn::before   { background: var(--yellow); }
  .issue-card.flag-info::before   { background: var(--blue); }
  .issue-card.flag-ok::before     { background: var(--green); }

  .issue-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .issue-badge {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
  }
  .issue-badge.flag-error  { background: var(--red-dim);    color: var(--red);    border: 1px solid rgba(239,68,68,0.3); }
  .issue-badge.flag-warn   { background: var(--yellow-dim); color: var(--yellow); border: 1px solid rgba(245,158,11,0.3); }
  .issue-badge.flag-info   { background: var(--blue-dim);   color: var(--blue);   border: 1px solid rgba(96,165,250,0.3); }

  .issue-date   { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
  .issue-company { font-size: 12px; font-weight: 500; color: var(--accent); }

  .issue-detail {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .detail-field { display: flex; flex-direction: column; gap: 3px; }
  .detail-label {
    font-size: 9px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .detail-value {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-bright);
  }
  .detail-value.task-label {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-white);
  }

  .suggestion-block {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .suggestion-label {
    font-size: 9px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .suggestion-text {
    font-size: 12px;
    color: var(--text-bright);
    font-style: italic;
  }

  /* ── Action footer ── */
  .wizard-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .wizard-footer .spacer { flex: 1; }

  .btn-wiz-primary {
    padding: 8px 20px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: opacity var(--transition);
  }
  .btn-wiz-primary:hover { opacity: 0.88; }

  .btn-wiz-secondary {
    padding: 8px 16px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all var(--transition);
  }
  .btn-wiz-secondary:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .btn-wiz-done {
    padding: 8px 16px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all var(--transition);
    margin-left: 4px;
  }
  .btn-wiz-done:hover { border-color: var(--text-muted); color: var(--text-muted); }

  /* ── Completion screen ── */
  .completion-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
  }
  .completion-icon { font-size: 40px; line-height: 1; }
  .completion-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-white);
  }
  .completion-sub {
    font-size: 12px;
    color: var(--text-muted);
    max-width: 300px;
    line-height: 1.5;
  }
  .btn-wiz-close-final {
    margin-top: 8px;
    padding: 9px 28px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: opacity var(--transition);
  }
  .btn-wiz-close-final:hover { opacity: 0.88; }

  /* ── Loading / empty states ── */
  .wizard-loading {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<div class="wizard-titlebar">
  <span class="titlebar-title" id="titlebar-label">Audit Wizard</span>
  <button class="titlebar-close" id="btn-titlebar-close" title="Close">✕</button>
</div>

<div class="wizard-body" id="wizard-body">
  <div class="wizard-loading">Loading issues…</div>
</div>

<script src="../components/settings.js"></script>
<script src="audit-wizard.js"></script>
</body>
</html>
