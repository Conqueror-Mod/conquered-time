<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; blob:;">
<title>Conquered Time — Profile</title>
<link rel="stylesheet" href="../styles/design-system.css">
<script>
  (function(){var t=sessionStorage.getItem('ct_theme');var s=sessionStorage.getItem('ct_scale');if(t)document.documentElement.setAttribute('data-theme',t);if(s)document.documentElement.setAttribute('data-scale',s);document.documentElement.style.visibility='hidden';})();
</script>
<style>
  .profile-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 16px;
    align-items: start;
  }

  /* ── Identity card ── */
  .identity-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 20px 24px;
    box-shadow: var(--shadow-2), var(--shadow-inset);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
  }

  /* ── Avatar ── */
  .avatar-wrap {
    position: relative;
    cursor: pointer;
    border-radius: 50%;
    user-select: none;
  }
  .avatar-wrap:hover .avatar-overlay { opacity: 1; }
  .avatar-circle {
    width: 100px; height: 100px;
    border-radius: 50%;
    border: 2px solid var(--border-light);
    background: var(--surface-2);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--sans);
    font-size: 32px;
    font-weight: 600;
    color: var(--accent);
    transition: border-color var(--transition);
  }
  .avatar-wrap:hover .avatar-circle { border-color: var(--accent); }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar-overlay {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity var(--transition);
    pointer-events: none;
  }
  .avatar-overlay-label {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-align: center;
  }
  #avatar-file-input { display: none; }

  .identity-display-name {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    color: var(--text-white);
    text-align: center;
    word-break: break-word;
  }
  .identity-username-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-bright);
    background: var(--surface-2);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
  }
  .identity-username-chip .chip-label {
    font-family: var(--sans);
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  /* Suppress browser autofill background blowout */
  input:-webkit-autofill,
  input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 1000px var(--surface-2) inset !important;
    -webkit-text-fill-color: var(--text-bright) !important;
  }

  .identity-field-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* ── Right panel ── */
  .profile-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .profile-panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    box-shadow: var(--shadow-1), var(--shadow-inset);
  }
  .panel-title {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-bright);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
  }

  .fields-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 20px;
  }
  .field-group { display: flex; flex-direction: column; gap: 5px; }

  /* ── Change password panel ── */
  .collapsible-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .collapsible-header:hover .panel-title { color: var(--text-white); }
  .collapsible-chevron {
    font-size: 10px;
    color: var(--text-dim);
    transition: transform var(--transition);
  }
  .collapsible-chevron.open { transform: rotate(180deg); }
  .collapsible-body {
    display: none;
    flex-direction: column;
    gap: 14px;
    margin-top: 16px;
  }
  .collapsible-body.open { display: flex; }
  .pw-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .pw-row-full { grid-column: 1 / -1; }

  .pw-result {
    font-family: var(--sans);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: var(--radius);
    display: none;
  }
  .pw-result.error   { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }
  .pw-result.success { background: var(--green-dim); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }

  /* ── Crop modal ── */
  #crop-modal {
    position: fixed;
    inset: 0;
    z-index: 900;
    background: rgba(0,0,0,0.72);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #crop-modal.hidden { display: none; }
  .crop-panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-3);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 340px;
  }
  .crop-title {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-bright);
    align-self: flex-start;
  }
  .crop-viewport {
    position: relative;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    overflow: hidden;
    cursor: grab;
    user-select: none;
    border: 2px solid var(--border-light);
  }
  .crop-viewport:active { cursor: grabbing; }
  #crop-canvas {
    display: block;
    width: 280px;
    height: 280px;
    touch-action: none;
  }
  .crop-mask {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    /* darken outside the circle — handled by viewport border-radius clip */
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.55);
  }
  .crop-hint {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.5;
  }
  .crop-zoom-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }
  .crop-zoom-btn {
    width: 28px; height: 28px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-light);
    background: var(--surface-2);
    color: var(--text-bright);
    font-size: 16px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background var(--transition), border-color var(--transition);
  }
  .crop-zoom-btn:hover { background: var(--surface-3); border-color: var(--accent); }
  #crop-zoom-slider {
    flex: 1;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .crop-actions {
    display: flex;
    gap: 10px;
    align-self: flex-end;
  }

  /* ── Footer ── */
  .profile-footer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 4px;
  }
  .unsaved-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--yellow);
    opacity: 0;
    transition: opacity var(--transition);
    flex-shrink: 0;
  }
  .unsaved-dot.visible { opacity: 1; }
  .unsaved-label {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--text-muted);
    opacity: 0;
    transition: opacity var(--transition);
  }
  .unsaved-label.visible { opacity: 1; }
</style>
</head>
<body>

<div id="email-required-banner" style="display:none; background:var(--accent-dim); border-bottom:2px solid var(--accent); padding:10px 20px; font-size:13px; color:var(--text-bright); display:none; align-items:center; gap:10px;">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;color:var(--accent)"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
  <span>An email address is required to use Conquered Time. Please add one below before continuing.</span>
</div>

<div class="page-header">
  <div class="page-title-block">
    <div class="page-eyebrow">Account</div>
    <div class="page-title">Profile</div>
  </div>
</div>

<div class="profile-layout" id="profile-layout">

  <!-- ── Left: Identity card ── -->
  <div class="identity-card">
    <div class="avatar-wrap" id="avatar-wrap" title="Click to upload a photo">
      <div class="avatar-circle" id="avatar-circle">
        <span id="avatar-initials"></span>
      </div>
      <div class="avatar-overlay">
        <div class="avatar-overlay-label">Change<br>Photo</div>
      </div>
    </div>
    <input type="file" id="avatar-file-input" accept="image/*">

  <!-- ── Crop modal ── -->
  <div id="crop-modal" class="hidden">
    <div class="crop-panel">
      <div class="crop-title">Crop Photo</div>
      <div class="crop-viewport" id="crop-viewport">
        <canvas id="crop-canvas" width="280" height="280"></canvas>
      </div>
      <div class="crop-hint">Drag to reposition &nbsp;·&nbsp; Scroll or use ± to zoom</div>
      <div class="crop-zoom-row">

      </div>

        <button class="btn-ghost" id="crop-cancel">Cancel</button>
        <button class="btn-primary" id="crop-apply">Apply Crop</button>

    </div>
  </div>

    <div id="identity-display-name-view" class="identity-display-name"></div>
    <div class="identity-username-chip">
      <span class="chip-label">Login</span>
      <span id="identity-username-value">—</span>
    </div>

    <div class="identity-field-wrap">
      <div class="field-label">Display Name</div>
      <input class="form-input" id="field-display-name" type="text" placeholder="How you appear in the app" autocomplete="off">
    </div>
  </div>

  <!-- ── Right: panels ── -->
  <div class="profile-right">

    <!-- Personal Details -->
    <div class="profile-panel">
      <div class="panel-title">Personal Details</div>
      <div class="fields-grid">
        <div class="field-group">
          <label class="field-label" for="field-full-name">Full Name</label>
          <input class="form-input" id="field-full-name" type="text" placeholder="Your legal or preferred name" autocomplete="off">
        </div>
        <div class="field-group">
          <label class="field-label" for="field-job-title">Job Title / Role</label>
          <input class="form-input" id="field-job-title" type="text" placeholder="e.g. Senior Translator" autocomplete="off">
        </div>
        <div class="field-group">
          <label class="field-label" for="field-work-state">Work state</label>
          <select class="form-input" id="field-work-state"></select>
        </div>
        <div class="field-group">
          <label class="field-label" for="field-email">Email Address</label>
          <input class="form-input" id="field-email" type="email" placeholder="your@email.com" autocomplete="off">
        </div>
        <div class="field-group">
          <label class="field-label" for="field-phone">Phone Number</label>
          <input class="form-input" id="field-phone" type="tel" placeholder="+1 (555) 000-0000" autocomplete="off">
        </div>
      </div>
    </div>

    <!-- Change Password -->
    <div class="profile-panel" id="pw-panel">
      <div class="collapsible-header" id="pw-toggle">
        <div class="panel-title" style="margin-bottom:0;">Change Password</div>
        <span class="collapsible-chevron" id="pw-chevron">▼</span>
      </div>
      <div class="collapsible-body" id="pw-body">
        <div class="pw-row">
          <div class="field-group">
            <label class="field-label" for="field-current-pw">Current Password</label>
            <input class="form-input" id="field-current-pw" type="password" placeholder="••••••••" autocomplete="current-password">
          </div>
          <div class="field-group">
            <label class="field-label" for="field-totp">TOTP Code</label>
            <input class="form-input" id="field-totp" type="text" placeholder="000000" maxlength="6" autocomplete="one-time-code" style="font-family:var(--mono);letter-spacing:0.2em;">
          </div>
          <div class="field-group">
            <label class="field-label" for="field-new-pw">New Password</label>
            <input class="form-input" id="field-new-pw" type="password" placeholder="••••••••" autocomplete="new-password">
          </div>
          <div class="field-group">
            <label class="field-label" for="field-confirm-pw">Confirm New Password</label>
            <input class="form-input" id="field-confirm-pw" type="password" placeholder="••••••••" autocomplete="new-password">
          </div>
        </div>
        <div class="pw-result" id="pw-result"></div>
        <div>
          <button class="btn-primary" id="btn-change-password">Change Password</button>
        </div>
      </div>

    <!-- Footer -->
    <div class="profile-footer">
      <button class="btn-primary" id="btn-save">Save Changes</button>
      <div class="unsaved-dot" id="unsaved-dot"></div>
      <div class="unsaved-label" id="unsaved-label">Unsaved changes</div>
    </div>

  </div>
</div>

<script src="../components/settings.js"></script>
<script src="../components/shell.js"></script>
<script>
  let avatarDataUrl = null;
  let dirty = false;
  let originalValues = {};
  let session = null;

  window.addEventListener('DOMContentLoaded', async () => {
    await Shell.init('profile');
    document.documentElement.style.visibility = '';

    // Build state dropdown options via JS to avoid a large static option list
    (function buildStateDropdown() {
      const states = [
        ['','Not specified (general recommendations)'],
        ['AK','Alaska'],['AL','Alabama'],['AR','Arkansas'],['AZ','Arizona'],
        ['CA','California'],['CO','Colorado'],['CT','Connecticut'],
        ['DC','Washington D.C.'],['DE','Delaware'],['FL','Florida'],
        ['GA','Georgia'],['HI','Hawaii'],['IA','Iowa'],['ID','Idaho'],
        ['IL','Illinois'],['IN','Indiana'],['KS','Kansas'],['KY','Kentucky'],
        ['LA','Louisiana'],['MA','Massachusetts'],['MD','Maryland'],['ME','Maine'],
        ['MI','Michigan'],['MN','Minnesota'],['MO','Missouri'],['MS','Mississippi'],
        ['MT','Montana'],['NC','North Carolina'],['ND','North Dakota'],['NE','Nebraska'],
        ['NH','New Hampshire'],['NJ','New Jersey'],['NM','New Mexico'],['NV','Nevada'],
        ['NY','New York'],['OH','Ohio'],['OK','Oklahoma'],['OR','Oregon'],
        ['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],
        ['SD','South Dakota'],['TN','Tennessee'],['TX','Texas'],['UT','Utah'],
        ['VA','Virginia'],['VT','Vermont'],['WA','Washington'],['WI','Wisconsin'],
        ['WV','West Virginia'],['WY','Wyoming'],
      ];
      const sel = document.getElementById('field-work-state');
      states.forEach(([code, name]) => {
        const opt = document.createElement('option');
        opt.value = code; opt.textContent = name;
        sel.appendChild(opt);
      });
    })();

    const profile = await api.invoke('profile:get');
    session = await api.invoke('session:get');

    // Populate identity sidebar
    const username = session?.username || '—';
    document.getElementById('identity-username-value').textContent = username;

    const displayName = profile?.display_name || '';
    document.getElementById('field-display-name').value = displayName;
    document.getElementById('identity-display-name-view').textContent = displayName || username;
    updateAvatarPreview(profile?.avatar || null, displayName || username);

    // Populate personal details
    document.getElementById('field-full-name').value  = profile?.full_name  || '';
    document.getElementById('field-job-title').value  = profile?.job_title  || '';
    document.getElementById('field-work-state').value = profile?.work_state || '';
    document.getElementById('field-email').value      = profile?.email      || '';
    document.getElementById('field-phone').value      = profile?.phone      || '';

    avatarDataUrl = profile?.avatar || null;

    // Snapshot original values for dirty tracking
    snapshotOriginal();

    // ── Email-required gate ───────────────────────────────────────────────
    const requireEmail = sessionStorage.getItem('require_email') === '1';
    if (requireEmail) {
      const banner = document.getElementById('email-required-banner');
      if (banner) banner.style.display = 'flex';
      // Focus email field so user knows exactly where to go
      setTimeout(() => document.getElementById('field-email')?.focus(), 100);
      // Block sidebar nav links until email is saved
      document.addEventListener('click', function emailGate(e) {
        const navLink = e.target.closest('.nav-item, .sidebar-nav a, [data-page]');
        if (navLink && !navLink.closest('#profile-layout')) {
          if (!document.getElementById('field-email')?.value.trim()) {
            e.stopImmediatePropagation();
            e.preventDefault();
            Shell.toast('Add an email address and save your profile before navigating away.', 'error');
          }
        }
      }, true);
    }

    // ── Event listeners ──────────────────────────────────────────────────
    const trackableInputs = [
      'field-display-name', 'field-full-name', 'field-job-title',
      'field-work-state', 'field-email', 'field-phone'
    ];
    trackableInputs.forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        markDirty();
        // Live-update the identity preview from display name
        if (id === 'field-display-name') {
          const dn = document.getElementById('field-display-name').value.trim();
          document.getElementById('identity-display-name-view').textContent = dn || username;
          updateAvatarInitials(dn || username);
        }
      });
    });

    // Avatar upload
    document.getElementById('avatar-wrap').addEventListener('click', () => {
      document.getElementById('avatar-file-input').click();
    });
    document.getElementById('avatar-file-input').addEventListener('change', handleAvatarUpload);

    // Save
    document.getElementById('btn-save').addEventListener('click', saveProfile);

    // Password panel toggle
    document.getElementById('pw-toggle').addEventListener('click', () => {
      const body    = document.getElementById('pw-body');
      const chevron = document.getElementById('pw-chevron');
      const isOpen  = body.classList.toggle('open');
      chevron.classList.toggle('open', isOpen);
    });

    // Change password
    document.getElementById('btn-change-password').addEventListener('click', changePassword);

    // Crop modal
    initCropModal();
  });

  // ── Avatar helpers ───────────────────────────────────────────────────────
  function getInitials(name) {
    const parts = name.trim().split(/\s+/);
    if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    return name.slice(0, 2).toUpperCase();
  }

  function updateAvatarInitials(name) {
    const circle = document.getElementById('avatar-circle');
    if (avatarDataUrl) return; // avatar image takes precedence
    document.getElementById('avatar-initials').textContent = getInitials(name);
  }

  function updateAvatarPreview(dataUrl, fallbackName) {
    const circle = document.getElementById('avatar-circle');
    const initials = document.getElementById('avatar-initials');
    if (dataUrl) {
      initials.style.display = 'none';
      let img = circle.querySelector('img');
      if (!img) { img = document.createElement('img'); circle.appendChild(img); }
      img.src = dataUrl;
    } else {
      initials.style.display = '';
      initials.textContent = getInitials(fallbackName || '?');
      const img = circle.querySelector('img');
      if (img) img.remove();
    }
  }

  const ANIMATED_TYPES = ['image/gif', 'image/apng', 'image/webp'];

  // ── Crop state ───────────────────────────────────────────────────────────
  const CROP_SIZE = 280; // canvas/viewport px
  let cropImg    = null;
  let cropMinScale = 1;
  let cropScale  = 1;
  let cropOx     = 0; // image draw origin X on canvas
  let cropOy     = 0;
  let cropDragging = false;
  let cropDragStartX = 0, cropDragStartY = 0;
  let cropDragOriginX = 0, cropDragOriginY = 0;

  function cropClamp() {
    // Keep image covering the circle (no blank edges inside viewport)
    const iw = cropImg.width  * cropScale;
    const ih = cropImg.height * cropScale;
    cropOx = Math.min(0, Math.max(CROP_SIZE - iw, cropOx));
    cropOy = Math.min(0, Math.max(CROP_SIZE - ih, cropOy));
  }

  function cropDraw() {
    const canvas = document.getElementById('crop-canvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, CROP_SIZE, CROP_SIZE);
    ctx.drawImage(cropImg, cropOx, cropOy,
      cropImg.width * cropScale, cropImg.height * cropScale);
  }

  function cropSetScale(newScale) {
    // Zoom around canvas center
    const cx = CROP_SIZE / 2, cy = CROP_SIZE / 2;
    const ratio = newScale / cropScale;
    cropOx = cx - (cx - cropOx) * ratio;
    cropOy = cy - (cy - cropOy) * ratio;
    cropScale = newScale;
    cropClamp();
    cropDraw();
    syncSlider();
  }

  function syncSlider() {
    const slider = document.getElementById('crop-zoom-slider');
    const maxScale = cropMinScale * 4;
    const t = (cropScale - cropMinScale) / (maxScale - cropMinScale);
    slider.value = Math.round(t * 100);
  }

  function openCropModal(img) {
    cropImg = img;
    // Min scale: image must cover the full CROP_SIZE circle
    cropMinScale = Math.max(CROP_SIZE / img.width, CROP_SIZE / img.height);
    cropScale    = cropMinScale;
    // Center image
    cropOx = (CROP_SIZE - img.width  * cropScale) / 2;
    cropOy = (CROP_SIZE - img.height * cropScale) / 2;
    cropClamp();
    cropDraw();
    syncSlider();
    document.getElementById('crop-modal').classList.remove('hidden');
  }

  function commitCrop() {
    const out = document.createElement('canvas');
    out.width = 200; out.height = 200;
    const ctx = out.getContext('2d');
    // Map the canvas viewport back to image source coords
    const srcX = -cropOx / cropScale;
    const srcY = -cropOy / cropScale;
    const srcW =  CROP_SIZE / cropScale;
    const srcH =  CROP_SIZE / cropScale;
    ctx.drawImage(cropImg, srcX, srcY, srcW, srcH, 0, 0, 200, 200);
    avatarDataUrl = out.toDataURL('image/jpeg', 0.85);
    updateAvatarPreview(avatarDataUrl, '');
    markDirty();
    document.getElementById('crop-modal').classList.add('hidden');
  }

  function handleAvatarUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      if (ANIMATED_TYPES.includes(file.type)) {
        avatarDataUrl = evt.target.result;
        updateAvatarPreview(avatarDataUrl, '');
        markDirty();
      } else {
        const img = new Image();
        img.onload = () => openCropModal(img);
        img.src = evt.target.result;
      }
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  // Crop modal interactions (wired after DOMContentLoaded)
  function initCropModal() {
    const viewport = document.getElementById('crop-viewport');
    const slider   = document.getElementById('crop-zoom-slider');

    // Drag to pan
    viewport.addEventListener('mousedown', ev => {
      cropDragging   = true;
      cropDragStartX = ev.clientX;
      cropDragStartY = ev.clientY;
      cropDragOriginX = cropOx;
      cropDragOriginY = cropOy;
      ev.preventDefault();
    });
    window.addEventListener('mousemove', ev => {
      if (!cropDragging) return;
      cropOx = cropDragOriginX + (ev.clientX - cropDragStartX);
      cropOy = cropDragOriginY + (ev.clientY - cropDragStartY);
      cropClamp();
      cropDraw();
    });
    window.addEventListener('mouseup', () => { cropDragging = false; });

    // Scroll to zoom
    viewport.addEventListener('wheel', ev => {
      ev.preventDefault();
      const delta = ev.deltaY > 0 ? -0.05 : 0.05;
      const maxScale = cropMinScale * 4;
      cropSetScale(Math.max(cropMinScale, Math.min(maxScale, cropScale + delta * cropMinScale)));
    }, { passive: false });

    // +/- buttons
    document.getElementById('crop-zoom-in').addEventListener('click', () => {
      cropSetScale(Math.min(cropMinScale * 4, cropScale + 0.1 * cropMinScale));
    });
    document.getElementById('crop-zoom-out').addEventListener('click', () => {
      cropSetScale(Math.max(cropMinScale, cropScale - 0.1 * cropMinScale));
    });

    // Slider
    slider.addEventListener('input', () => {
      const t = slider.value / 100;
      const maxScale = cropMinScale * 4;
      const newScale = cropMinScale + t * (maxScale - cropMinScale);
      cropSetScale(newScale);
    });

    document.getElementById('crop-apply').addEventListener('click', commitCrop);
    document.getElementById('crop-cancel').addEventListener('click', () => {
      document.getElementById('crop-modal').classList.add('hidden');
    });
  }

  // ── Dirty tracking ───────────────────────────────────────────────────────
  function snapshotOriginal() {
    originalValues = {
      display_name: document.getElementById('field-display-name').value,
      full_name:    document.getElementById('field-full-name').value,
      job_title:    document.getElementById('field-job-title').value,
      work_state:   document.getElementById('field-work-state').value,
      email:        document.getElementById('field-email').value,
      phone:        document.getElementById('field-phone').value,
      avatar:       avatarDataUrl,
    };
    dirty = false;
    setDirtyUI(false);
  }

  function markDirty() {
    dirty = true;
    setDirtyUI(true);
  }

  function setDirtyUI(isDirty) {
    document.getElementById('unsaved-dot').classList.toggle('visible', isDirty);
    document.getElementById('unsaved-label').classList.toggle('visible', isDirty);
  }

  // ── Save ─────────────────────────────────────────────────────────────────
  function makeThumb48(dataUrl) {
    if (!dataUrl) return null;
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = c.height = 48;
        c.getContext('2d').drawImage(img, 0, 0, 48, 48);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => resolve(null);
      img.src = dataUrl;
    });
  }

  async function saveProfile() {
    const payload = {
      display_name:    document.getElementById('field-display-name').value.trim(),
      full_name:       document.getElementById('field-full-name').value.trim(),
      job_title:       document.getElementById('field-job-title').value.trim(),
      work_state:      document.getElementById('field-work-state').value || null,
      email:           document.getElementById('field-email').value.trim(),
      phone:           document.getElementById('field-phone').value.trim(),
      avatar:          avatarDataUrl,
      avatar_thumb_48: await makeThumb48(avatarDataUrl),
    };
    if (sessionStorage.getItem('require_email') === '1' && !payload.email) {
      Shell.toast('Email address is required. Please add one before saving.', 'error');
      document.getElementById('field-email')?.focus();
      return;
    }
    const res = await api.invoke('profile:save', payload);
    if (res?.ok) {
      Shell.toast('Profile saved.', 'success');
      Shell.setSidebarAvatar({ avatar: avatarDataUrl }, payload.display_name, session?.username);
      snapshotOriginal();
      // Email gate satisfied — clear flag and continue to dashboard
      if (sessionStorage.getItem('require_email') === '1') {
        sessionStorage.removeItem('require_email');
        Shell.toast('Email saved. Taking you to the dashboard.', 'success');
        setTimeout(() => api.send('navigate', 'dashboard'), 800);
      }
    } else {
      Shell.toast('Save failed: ' + (res?.error || 'unknown error'), 'error');
    }
  }

  // ── Change password ──────────────────────────────────────────────────────
  async function changePassword() {
    const result   = document.getElementById('pw-result');
    const currentPw = document.getElementById('field-current-pw').value;
    const totp      = document.getElementById('field-totp').value.trim();
    const newPw     = document.getElementById('field-new-pw').value;
    const confirmPw = document.getElementById('field-confirm-pw').value;

    result.style.display = 'none';

    if (!currentPw || !totp || !newPw || !confirmPw) {
      showPwResult('error', 'All fields are required.');
      return;
    }
    if (newPw !== confirmPw) {
      showPwResult('error', 'New passwords do not match.');
      return;
    }
    if (newPw.length < 8) {
      showPwResult('error', 'New password must be at least 8 characters.');
      return;
    }

    const btn = document.getElementById('btn-change-password');
    btn.disabled = true;
    btn.textContent = 'Updating…';

    const res = await api.invoke('auth:change-password', {
      currentPassword: currentPw,
      totpCode:        totp,
      newPassword:     newPw,
    });

    btn.disabled = false;
    btn.textContent = 'Change Password';

    if (res?.ok) {
      showPwResult('success', 'Password changed successfully. All data re-encrypted with your new key.');
      // Clear fields and collapse panel on success
      ['field-current-pw', 'field-totp', 'field-new-pw', 'field-confirm-pw'].forEach(id => {
        document.getElementById(id).value = '';
      });
      setTimeout(() => {
        document.getElementById('pw-body').classList.remove('open');
        document.getElementById('pw-chevron').classList.remove('open');
        document.getElementById('pw-result').style.display = 'none';
      }, 2500);
    } else {
      showPwResult('error', res?.error || 'Password change failed.');
    }
  }

  function showPwResult(type, msg) {
    const el = document.getElementById('pw-result');
    el.className = `pw-result ${type}`;
    el.textContent = msg;
    el.style.display = '';
  }
</script>
