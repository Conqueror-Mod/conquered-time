<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
<title>Conquered Time — Companies</title>
<link rel="stylesheet" href="../styles/design-system.css">
<script src="theme-init.js"></script>
<style>
  .web-layout {
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 16px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* Canvas */
  #spiderweb-wrap {
    position: relative;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    height: 100%;
    box-shadow: var(--shadow-1), var(--shadow-inset);
  }
  #spiderweb-wrap::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    opacity: 0.6;
    z-index: 2;
    pointer-events: none;
  }
  #web-canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    display: block; cursor: default;
  }

  /* Right panel — flex column with list + detail */
  .company-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    overflow: hidden;
  }
  .company-list-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .company-panel.detail-open .company-list-panel {
    flex: 0 0 auto;
    max-height: 38%;
  }
  /* Search + filter bar */
  .company-filter-bar {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .company-search-wrap { position: relative; display: flex; }
  .company-search-input {
    width: 100%;
    padding: 7px 28px 7px 10px;
    font-size: 12px;
    font-family: var(--sans);
    color: var(--text-bright);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: border-color var(--transition);
  }
  .company-search-input:focus { outline: none; border-color: var(--accent); }
  .company-search-input::placeholder { color: var(--text-dim); }
  .company-search-clear {
    position: absolute;
    right: 4px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    padding: 2px 5px;
    line-height: 1;
    border-radius: var(--radius);
  }
  .company-search-clear:hover { color: var(--text-bright); }
  .company-filter-row { display: flex; gap: 6px; }
  .company-filter-select {
    flex: 1;
    min-width: 0;
    padding: 5px 8px;
    font-size: 11px;
    font-family: var(--sans);
    color: var(--text-bright);
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
  }
  .company-filter-select:focus { outline: none; border-color: var(--accent); }

  .company-list-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  /* Empty state for an active filter that matches nothing */
  .company-list-empty {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    padding: 24px 12px;
    line-height: 1.6;
  }

  /* List items — 2-line cards */
  .company-list-item {
    flex-shrink: 0;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 10px 14px;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow-1);
  }
  .company-list-item:hover    { border-color: var(--accent); background: var(--surface-2); box-shadow: var(--shadow-2); }
  .company-list-item.selected { border-color: var(--accent); background: var(--accent-dim); }
  .company-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
    flex-shrink: 0;
    margin-top: 2px;
    align-self: flex-start;
  }
  .company-info { flex: 1; min-width: 0; }
  .company-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-bright);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .company-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .company-hours {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--yellow);
    flex-shrink: 0;
    align-self: flex-start;
    margin-top: 2px;
  }

  /* Detail pane */
  .company-detail-panel {
    display: none;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .company-panel.detail-open .company-detail-panel { display: flex; }
  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .detail-header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .detail-company-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-bright);
    line-height: 1.3;
    /* D-008: long names clamp to 2 lines instead of x-scrolling the pane */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .detail-close-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 0 2px;
    line-height: 1;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .detail-close-btn:hover { color: var(--text-bright); }
  .detail-breadcrumb {
    font-size: 11px;
    color: var(--accent);
    font-family: var(--mono);
    margin-top: 2px;
    overflow-wrap: anywhere; /* D-008 */
  }
  .detail-stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .det-chip {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    white-space: nowrap;
  }
  .det-chip.accent { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .det-chip.green  { border-color: var(--green,#22c55e); color: var(--green,#22c55e); background: var(--green-dim,rgba(34,197,94,0.1)); }
  .det-chip.yellow { border-color: var(--yellow); color: var(--yellow); background: rgba(245,158,11,0.08); }
  .detail-field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
  }
  .det-field { display: flex; flex-direction: column; gap: 2px; }
  .det-field-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .det-field-value { font-size: 12px; color: var(--text-bright); word-break: break-word; }
  .det-field-value.empty { color: var(--text-dim); font-style: italic; }
  .det-field.span-2 { grid-column: span 2; }
  .detail-notes-block { display: none; flex-direction: column; gap: 4px; }
  .detail-notes-block.has-notes { display: flex; }
  .det-notes-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .det-notes-text {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
    max-height: 64px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
  }
  .detail-divider { height: 1px; background: var(--border); }
  .detail-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .detail-actions .btn-primary  { flex: 1; min-width: 80px; }
  .detail-actions .btn-neutral  { flex: 1; min-width: 80px; }
  .detail-actions .btn-danger   { flex: 0 0 auto; }

  /* Modal grid */
  .modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .modal-grid .span-2 { grid-column: span 2; }
  .section-divider {
    grid-column: span 2;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-top: 6px;
  }

  /* Node tooltip */
  #node-tooltip {
    position: absolute;
    background: var(--surface-3);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-bright);
    pointer-events: none;
    z-index: 10;
    display: none;
    box-shadow: var(--shadow-2);
    max-width: 220px;
  }
  .tooltip-name   { font-weight: 600; color: var(--text-white); margin-bottom: 3px; }
  .tooltip-hier   { font-size: 11px; color: var(--accent); margin-bottom: 2px; font-family: var(--mono); }
  .tooltip-detail { font-size: 11px; color: var(--text-muted); }

  /* Context menu */
  #ctx-menu {
    position: absolute;
    background: var(--surface-3);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 4px;
    z-index: 20;
    display: none;
    min-width: 170px;
    box-shadow: var(--shadow-3);
  }
  .ctx-item {
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-bright);
    cursor: pointer;
    border-radius: var(--radius);
    transition: all var(--transition);
  }
  .ctx-item:hover        { background: var(--accent-dim); color: var(--accent); }
  .ctx-item.danger       { color: var(--red); }
  .ctx-item.danger:hover { background: var(--red-dim); }
  .ctx-divider { height: 1px; background: var(--border); margin: 4px 0; }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title-block">
    <div class="page-eyebrow">Network</div>
    <div class="page-title">Company Web</div>
  </div>
  <div class="page-actions">
    <button class="btn-primary" id="btn-add-company">+ Add Company</button>
  </div>
</div>

<div class="web-layout">
  <div id="spiderweb-wrap">
    <canvas id="web-canvas"></canvas>
    <div id="node-tooltip">
      <div class="tooltip-name"   id="tt-name"></div>
      <div class="tooltip-hier"   id="tt-hier"></div>
      <div class="tooltip-detail" id="tt-detail"></div>
    </div>
    <div id="ctx-menu">
      <div class="ctx-item" id="ctx-open-tracker">⏱ Open Time Tracker</div>
      <div class="ctx-item" id="ctx-edit">✎ Edit Company</div>
      <div class="ctx-divider"></div>
      <div class="ctx-item danger" id="ctx-delete">⊗ Delete</div>
    </div>
  </div>

  <div class="company-panel" id="company-panel">

    <!-- Company list -->
    <div class="hud-panel company-list-panel">
      <div class="hud-panel-header">
        <div class="hud-panel-title">Companies</div>
        <span style="font-family:var(--mono);font-size:12px;color:var(--text-dim);" id="company-count">0</span>
      </div>
      <div class="company-filter-bar">
        <div class="company-search-wrap">
          <input type="text" id="company-search" class="company-search-input" placeholder="Search name, project, role…" autocomplete="off" spellcheck="false" data-tip="Filter the list and web by name, alias, hierarchy, job title, work type, location or Navigator ID">
          <button class="company-search-clear" id="company-search-clear" title="Clear search" style="display:none;">✕</button>
        </div>
        <div class="company-filter-row">
          <select id="company-status-filter" class="company-filter-select" aria-label="Status filter">
            <option value="all">All statuses</option>
            <option value="active">Active</option>
            <option value="ended">Ended</option>
          </select>
          <select id="company-type-filter" class="company-filter-select" aria-label="Work-type filter">
            <option value="">All types</option>
          </select>
        </div>
      </div>
      <div class="company-list-scroll" id="company-list">
        <div style="font-size:12px;color:var(--text-dim);text-align:center;padding:24px 0;">
          No companies yet. Add one to begin.
        </div>
      </div>
    </div>

    <!-- Detail pane — shown on selection -->
    <div class="hud-panel company-detail-panel" id="company-detail">
      <div class="hud-panel-header">
        <div class="hud-panel-title" id="det-panel-title">Details</div>
        <button class="detail-close-btn" id="det-close-btn">✕</button>
      </div>
      <div class="detail-body">
        <div>
          <div class="detail-header-row">
            <div>
              <div class="detail-company-name" id="det-name">—</div>
              <div class="detail-breadcrumb"   id="det-breadcrumb"></div>
            </div>
          </div>
        </div>
        <div class="detail-stats" id="det-stats"></div>
        <div class="detail-divider"></div>
        <div class="detail-field-grid" id="det-fields"></div>
        <div class="detail-notes-block" id="det-notes-block">
          <div class="det-notes-label">Notes</div>
          <div class="det-notes-text" id="det-notes-text"></div>
        </div>
        <div class="detail-divider"></div>
        <div class="detail-actions">
          <button class="btn-primary"  id="det-edit-btn">Edit</button>
          <button class="btn-neutral"  id="det-tracker-btn">Open Tracker</button>
          <button class="btn-danger"   id="det-delete-btn">Delete</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Company Modal -->
<div class="modal-overlay" id="company-modal" style="display:none;">
  <div class="modal-box" style="width:620px;">
    <div class="modal-title" id="modal-title">Add Company</div>

    <div class="modal-grid">
      <div class="section-divider">Work Hierarchy <span style="color:var(--accent);">*</span></div>

      <div class="field-group">
        <label class="field-label">Company *</label>
        <input type="text" id="f-hier-company" placeholder="e.g. RWS">
      </div>
      <div class="field-group">
        <label class="field-label">Project</label>
        <input type="text" id="f-hier-project" placeholder="e.g. Diamond">
      </div>
      <div class="field-group">
        <label class="field-label">Platform</label>
        <input type="text" id="f-hier-platform" placeholder="e.g. multimango">
      </div>
      <div class="field-group">
        <label class="field-label">Navigator ID</label>
        <input type="text" id="f-navid" placeholder="e.g. A123456">
      </div>

      <div class="section-divider">Additional Details</div>

      <div class="field-group span-2">
        <label class="field-label">Display Alias <span style="color:var(--text-dim);font-weight:400;">(optional — overrides company name in lists)</span></label>
        <input type="text" id="f-name" placeholder="e.g. RWS Annotation Team">
      </div>
      <div class="field-group">
        <label class="field-label">Job Title</label>
        <input type="text" id="f-title" placeholder="e.g. Annotation Specialist">
      </div>
      <div class="field-group">
        <label class="field-label">Type of Work</label>
        <select id="f-work-type">
          <option value="">— Select —</option>
          <option>Annotation</option><option>Code Review</option>
          <option>Training</option><option>Evaluation</option>
          <option>QA</option><option>Research</option>
          <option>Development</option><option>Admin</option><option>Other</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">Location / Country</label>
        <input type="text" id="f-location" placeholder="e.g. Remote — USA">
      </div>
      <div class="field-group">
        <label class="field-label">Pay Rate (/hr)</label>
        <input type="number" id="f-payrate" placeholder="0.00" step="0.01" min="0" data-tip="Hourly billing rate for this client. Used to calculate invoices.">
      </div>
      <div class="field-group">
        <label class="field-label">Invoice Currency</label>
        <select id="f-currency" data-tip="Currency invoices for this company are issued in. Leave as Default to use your profile's billing currency.">
          <option value="">Default (profile currency)</option>
          <option value="USD">USD — US Dollar</option>
          <option value="EUR">EUR — Euro</option>
          <option value="GBP">GBP — British Pound</option>
          <option value="CAD">CAD — Canadian Dollar</option>
          <option value="AUD">AUD — Australian Dollar</option>
          <option value="NZD">NZD — New Zealand Dollar</option>
          <option value="JPY">JPY — Japanese Yen</option>
          <option value="CHF">CHF — Swiss Franc</option>
          <option value="INR">INR — Indian Rupee</option>
          <option value="ZAR">ZAR — South African Rand</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">Date Started</label>
        <input type="date" id="f-date-start">
      </div>
      <div class="field-group">
        <label class="field-label">Date Ended</label>
        <input type="date" id="f-date-end">
      </div>

      <div class="section-divider">Platform Data</div>

      <div class="field-group span-2">
        <label class="field-label">Company Login / Username</label>
        <input type="text" id="f-login" placeholder="Platform login">
      </div>
      <div class="field-group span-2">
        <label class="field-label">Company Email</label>
        <input type="text" id="f-email" placeholder="work@company.com">
      </div>
      <div class="field-group span-2">
        <label class="field-label">Report Recipient</label>
        <input type="text" id="f-report-email" placeholder="reports@client.com (optional)" data-tip="Scheduled reports scoped to this company are emailed here instead of the default recipient">
      </div>
      <div class="field-group span-2">
        <label class="field-label">Billing Address</label>
        <textarea id="f-billing-address" placeholder="Client's address for the invoice “Bill To” block (optional)" data-tip="Appears as the client address on invoices generated for this company."></textarea>
      </div>
      <div class="field-group span-2">
        <label class="field-label">Platform URL</label>
        <input type="text" id="f-url" placeholder="https://platform.company.com">
      </div>
      <div class="field-group span-2">
        <label class="field-label">Supervisors</label>
        <input type="text" id="f-supervisors" placeholder="Comma-separated names">
      </div>
      <div class="field-group span-2">
        <label class="field-label">Notes</label>
        <textarea id="f-notes" placeholder="Any additional notes…"></textarea>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-neutral" id="modal-cancel-btn">Cancel</button>
      <button class="btn-danger"  id="delete-btn" style="display:none;">Delete</button>
      <button class="btn-primary" id="modal-save-btn">Save Company</button>
    </div>
  </div>
</div>

<script src="../components/settings.js"></script>
<script src="../components/about.js"></script>
<script src="../components/shell.js"></script>
<script src="../canvas-text.js"></script>
<script src="companies.js"></script>
</body>
</html>
