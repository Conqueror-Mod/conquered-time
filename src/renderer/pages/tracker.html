<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
<title>Conquered Time — Time Tracker</title>
<link rel="stylesheet" href="../styles/design-system.css">
<script src="theme-init.js"></script>
<style>
  .tracker-topbar {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-1), var(--shadow-inset);
    flex-wrap: wrap;
  }
  .topbar-field { display: flex; flex-direction: column; gap: 4px; }
  .topbar-label {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .topbar-select { min-width: 200px; }
  .topbar-date   { width: 160px; }
  .topbar-session { flex: 1; min-width: 200px; }

  .hierarchy-bar {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    flex: 1;
    min-width: 160px;
  }
  .hier-seg { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
  .hier-sep { color: var(--border-light); font-size: 11px; }
  .hier-navid { font-family: var(--mono); font-size: 11px; color: var(--accent-2); font-weight: 400; }

  .control-panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: var(--shadow-1), var(--shadow-inset);
  }
  .panel-field { display: flex; flex-direction: column; gap: 4px; }
  .panel-field label {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .panel-field--wide { flex: 1; min-width: 200px; }
  .panel-field select, .panel-field input { font-size: 13px; }
  .panel-divider { height: 1px; background: var(--border); margin: 0 -18px; }

  .row-num { font-family: var(--mono); font-size: 11px; color: var(--text-dim); text-align: center; min-width: 36px; }
  .cell-label  { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--accent); }
  .cell-text   { font-family: var(--sans); font-size: 13px; color: var(--text-bright); }
  .cell-desc   { font-family: var(--sans); font-size: 12px; color: var(--text); vertical-align: top; }
  /* Clamp long/multi-line descriptions to keep table rows compact; full text in
     the cell's title tooltip and in the expandable editor. */
  .desc-clamp {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-line;
    line-height: 1.45;
  }
  .cell-time   { font-family: var(--mono); font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .cell-time.has-time { color: var(--text-bright); }
  .cell-duration { font-family: var(--mono); font-size: 12px; color: var(--yellow); text-align: center; white-space: nowrap; }
  .cell-empty  { font-size: 12px; color: var(--text-dim); }
  td[data-field] { cursor: default; }
  td[data-field].editable { cursor: pointer; }
  td[data-field].editable:hover { background: var(--accent-dim); }

  /* ── Resizable columns (tracker table only) ── */
  #tracker-table { table-layout: fixed; }
  /* Fixed layout clips overflow; let cells truncate gracefully rather than
     spilling. The Description cell keeps its own .desc-clamp behaviour. */
  #tracker-table td { overflow: hidden; text-overflow: ellipsis; }
  #tracker-table thead th { position: relative; overflow: hidden; }
  #tracker-table .col-resizer {
    position: absolute; top: 0; right: -3px; width: 7px; height: 100%;
    cursor: col-resize; z-index: 2; user-select: none;
  }
  #tracker-table .col-resizer::after {
    content: ''; position: absolute; top: 25%; right: 3px; width: 1px; height: 50%;
    background: var(--border-light); transition: background var(--transition);
  }
  #tracker-table .col-resizer:hover::after,
  #tracker-table .col-resizer.dragging::after { background: var(--accent); width: 2px; }

  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .footer-totals { display: flex; flex-direction: column; gap: 8px; }
  .totals { font-family: var(--sans); font-size: 12px; color: var(--text-muted); }
  .totals span { font-family: var(--mono); color: var(--accent); font-size: 14px; font-weight: 400; }
  .breakdown-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .session-status { font-family: var(--sans); font-size: 11px; color: var(--text-dim); }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  /* ── Two-module control panel ── */
  .cp-modules { display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap; }
  .cp-module-label {
    font-family: var(--sans); font-size: 10px; font-weight: 600;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em;
  }
  /* Left: Session Clock module */
  .clock-module {
    flex: 0 0 236px;
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface-2);
  }
  .clock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .clock-grid button { width: 100%; white-space: nowrap; }
  #btn-break.bl-active, #btn-lunch.bl-active { border-color: var(--yellow); color: var(--yellow); }
  .bl-compliance-row { display: flex; flex-direction: column; gap: 4px; margin-top: auto; }
  .bl-compliance {
    font-family: var(--sans); font-size: 11px; color: var(--text-dim);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .bl-compliance svg { flex-shrink: 0; }
  .bl-compliance.ok   { color: var(--text-dim); }
  .bl-compliance.warn { color: var(--yellow); }
  .bl-compliance.over { color: var(--red); }
  /* Right: task inputs module */
  .inputs-module { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 12px; }
  .inputs-top { display: flex; gap: 12px; flex-wrap: wrap; }
  .inputs-top .panel-field:first-child { flex: 0 0 170px; }
  .inputs-top .panel-field--wide { flex: 1; min-width: 160px; }
  .inputs-module .panel-field input,
  .inputs-module .panel-field select { width: 100%; }
  /* Row tools strip */
  .row-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title-block">
    <div class="page-eyebrow">Time Tracker</div>
    <div class="page-title">Session Log</div>
  </div>
  <div class="page-actions" id="header-actions">
    <div id="live-badge" style="display:none;align-items:center;gap:6px;font-family:var(--sans);font-size:11px;font-weight:600;color:#39FF14;letter-spacing:0.05em;padding:4px 10px;border:1px solid #39FF14;border-radius:var(--radius);opacity:0.85;">
      <span id="live-dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#39FF14;animation:pulse-dot 2s ease-in-out infinite;"></span>
      LIVE
    </div>
    <button class="btn-neutral" id="btn-save-session">Save Session</button>
    <button class="btn-neutral" id="btn-export-pdf">Export PDF</button>
  </div>
</div>

<div class="tracker-topbar">
  <div class="topbar-field">
    <div class="topbar-label">Working For</div>
    <select id="company-select" class="topbar-select">
      <option value="">— Select Company —</option>
    </select>
  </div>
  <div class="topbar-field">
    <div class="topbar-label">Log Date</div>
    <input type="date" id="log-date" class="topbar-date" style="user-select:text;-webkit-user-select:text;">
  </div>
  <div class="topbar-field topbar-session">
    <div class="topbar-label">Session Label</div>
    <input type="text" id="log-notes" placeholder="e.g. Sprint #12 — Review batch" style="user-select:text;-webkit-user-select:text;">
  </div>
  <div class="hierarchy-bar" id="hierarchy-bar"></div>
</div>

<div class="control-panel">
  <div class="cp-modules">

    <!-- Left: Session Clock module — clock in/out + break/lunch -->
    <div class="clock-module">
      <span class="cp-module-label">Session Clock</span>
      <div class="clock-grid">
        <button class="btn-primary" id="btn-clock-in">⏱ Clock In</button>
        <button class="btn-primary" id="btn-clock-out">⏹ Clock Out</button>
        <button class="btn-neutral" id="btn-break">☕ Break</button>
        <button class="btn-neutral" id="btn-lunch">🍽 Lunch</button>
      </div>
      <div class="bl-compliance-row">
        <span class="bl-compliance" id="compliance-break">—</span>
        <span class="bl-compliance" id="compliance-lunch">—</span>
      </div>
    </div>

    <!-- Right: Task input fields -->
    <div class="inputs-module">
      <div class="inputs-top">
        <div class="panel-field">
          <label>Task Label</label>
          <select id="input-label">
            <option value="">— Select —</option>
            <option>Training</option><option>Evaluation</option>
            <option>Review</option><option>Annotation</option>
            <option>QA</option><option>Research</option>
            <option>Admin</option><option>Communication</option>
            <option>Other</option>
          </select>
        </div>
        <div class="panel-field panel-field--wide">
          <label>Task Name</label>
          <input type="text" id="input-name" placeholder="Enter task name…" style="user-select:text;-webkit-user-select:text;">
        </div>
      </div>
      <div class="panel-field">
        <label>Description</label>
        <input type="text" id="input-desc" placeholder="Enter description…" style="user-select:text;-webkit-user-select:text;">
      </div>
    </div>

  </div>
  <div class="panel-divider"></div>
  <div class="row-tools">
    <span class="cp-module-label">Row Tools</span>
    <button class="btn-neutral" id="btn-manual-entry">+ Manual Entry</button>
    <button class="btn-neutral" id="btn-clear-row">Clear Row</button>
    <button class="btn-danger"  id="btn-clear-all" style="margin-left:auto;">Clear All</button>
  </div>
</div>

<div class="table-wrap">
  <table id="tracker-table">
    <colgroup>
      <col><col><col><col><col><col><col><col>
    </colgroup>
    <thead>
      <tr>
        <th class="center">#</th>
        <th class="center"></th>
        <th>Task Label</th>
        <th>Name</th>
        <th>Description</th>
        <th>Clock In</th>
        <th>Clock Out</th>
        <th class="center">Total</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="footer-bar">
  <div class="footer-totals">
    <div class="totals">Total logged: <span id="total-time">0h 00m</span></div>
    <div class="breakdown-row" id="breakdown-row"></div>
    <div id="dispatch-preview" style="display:none;margin-top:6px;border-top:1px solid var(--border);padding-top:6px;">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span class="breakdown-chip task-count-chip" data-action="navigate" data-arg="task-timer" title="Open Dispatch" style="cursor:pointer;gap:5px;">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;"><circle cx="8" cy="9" r="5.5"/><line x1="8" y1="9" x2="8" y2="5.8"/><line x1="8" y1="9" x2="10.2" y2="10.3"/><line x1="6.5" y1="1.5" x2="9.5" y2="1.5"/><line x1="8" y1="1.5" x2="8" y2="3.5"/></svg>
          <span id="dispatch-count-label">Dispatch</span>
        </span>
        <div id="dispatch-task-chips" style="display:flex;gap:5px;flex-wrap:wrap;"></div>
        <span id="dispatch-open-link"
              data-action="navigate" data-arg="task-timer"
              style="font-family:var(--sans);font-size:11px;color:var(--accent);cursor:pointer;margin-left:auto;opacity:.8;">
          Open →
        </span>
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
    <div class="totals">Entries: <span id="rows-done">0</span> filled · <span id="rows-total">0</span> total</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn-xs" id="btn-switch-session" style="display:none;" title="This date has multiple sessions">Switch session</button>
      <div class="session-status" id="session-status"></div>
    </div>
  </div>
</div>

<script src="../components/settings.js"></script>
<script src="../components/about.js"></script>
<script src="../components/shell.js"></script>
<script src="pdf-fonts.js"></script>
<script src="../time-parse.js"></script>
<script src="tracker.js"></script>
</body>
</html>
