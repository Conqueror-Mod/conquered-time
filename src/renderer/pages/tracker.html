<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Conquered Time — Time Tracker</title>
<link rel="stylesheet" href="../styles/design-system.css">
<script>
  (function(){var t=sessionStorage.getItem('ct_theme');var s=sessionStorage.getItem('ct_scale');if(t)document.documentElement.setAttribute('data-theme',t);if(s)document.documentElement.setAttribute('data-scale',s);document.documentElement.style.visibility='hidden';})();
</script>
<style>
  .tracker-topbar {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-1), var(--shadow-inset);
    flex-wrap: wrap;
  }
  .topbar-field { display: flex; flex-direction: column; gap: 4px; }
  .topbar-label {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .topbar-select { min-width: 200px; }
  .topbar-date   { width: 160px; }
  .topbar-session { flex: 1; min-width: 200px; }

  .hierarchy-bar {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    flex: 1;
    min-width: 160px;
  }
  .hier-seg { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
  .hier-sep { color: var(--border-light); font-size: 11px; }
  .hier-navid { font-family: var(--mono); font-size: 11px; color: var(--accent-2); font-weight: 400; }

  .control-panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: var(--shadow-1), var(--shadow-inset);
  }
  .panel-inputs { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .panel-field { display: flex; flex-direction: column; gap: 4px; }
  .panel-field label {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .panel-field--wide { flex: 1; min-width: 200px; }
  .panel-field select, .panel-field input { font-size: 13px; }
  .panel-divider { height: 1px; background: var(--border); margin: 0 -18px; }
  .panel-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .row-num { font-family: var(--mono); font-size: 11px; color: var(--text-dim); text-align: center; min-width: 36px; }
  .cell-label  { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--accent); }
  .cell-text   { font-family: var(--sans); font-size: 13px; color: var(--text-bright); }
  .cell-desc   { font-family: var(--sans); font-size: 12px; color: var(--text); }
  .cell-time   { font-family: var(--mono); font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .cell-time.has-time { color: var(--text-bright); }
  .cell-duration { font-family: var(--mono); font-size: 12px; color: var(--yellow); text-align: center; white-space: nowrap; }
  .cell-empty  { font-size: 12px; color: var(--text-dim); }
  td[data-field] { cursor: default; }
  td[data-field].editable { cursor: pointer; }
  td[data-field].editable:hover { background: var(--accent-dim); }

  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .footer-totals { display: flex; flex-direction: column; gap: 8px; }
  .totals { font-family: var(--sans); font-size: 12px; color: var(--text-muted); }
  .totals span { font-family: var(--mono); color: var(--accent); font-size: 14px; font-weight: 400; }
  .breakdown-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .session-status { font-family: var(--sans); font-size: 11px; color: var(--text-dim); }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title-block">
    <div class="page-eyebrow">Time Tracker</div>
    <div class="page-title">Session Log</div>
  </div>
  <div class="page-actions" id="header-actions">
    <div id="live-badge" style="display:none;align-items:center;gap:6px;font-family:var(--sans);font-size:11px;font-weight:600;color:#39FF14;letter-spacing:0.05em;padding:4px 10px;border:1px solid #39FF14;border-radius:var(--radius);opacity:0.85;">
      <span id="live-dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#39FF14;animation:pulse-dot 2s ease-in-out infinite;"></span>
      LIVE
    </div>
    <button class="btn-neutral" id="btn-save-session">Save Session</button>
    <button class="btn-neutral" id="btn-export-pdf">Export PDF</button>
  </div>
</div>

<div class="tracker-topbar">
  <div class="topbar-field">
    <div class="topbar-label">Working For</div>
    <select id="company-select" class="topbar-select">
      <option value="">— Select Company —</option>
    </select>
  </div>
  <div class="topbar-field">
    <div class="topbar-label">Log Date</div>
    <input type="date" id="log-date" class="topbar-date" style="user-select:text;-webkit-user-select:text;">
  </div>
  <div class="topbar-field topbar-session">
    <div class="topbar-label">Session Label</div>
    <input type="text" id="log-notes" placeholder="e.g. Sprint #12 — Review batch" style="user-select:text;-webkit-user-select:text;">
  </div>
  <div class="hierarchy-bar" id="hierarchy-bar"></div>
</div>

<div class="control-panel">
  <div class="panel-inputs">
    <div class="panel-field">
      <label>Task Label</label>
      <select id="input-label">
        <option value="">— Select —</option>
        <option>Training</option><option>Evaluation</option>
        <option>Review</option><option>Annotation</option>
        <option>QA</option><option>Research</option>
        <option>Admin</option><option>Communication</option>
        <option>Other</option>
      </select>
    </div>
    <div class="panel-field">
      <label>Task Name</label>
      <input type="text" id="input-name" placeholder="Enter task name…" style="user-select:text;-webkit-user-select:text;">
    </div>
    <div class="panel-field panel-field--wide">
      <label>Description</label>
      <input type="text" id="input-desc" placeholder="Enter description…" style="user-select:text;-webkit-user-select:text;">
    </div>
  </div>
  <div class="panel-divider"></div>
  <div class="panel-actions">
    <button class="btn-primary" id="btn-clock-in">⏱ Clock In</button>
    <button class="btn-primary" id="btn-clock-out">⏹ Clock Out</button>
    <button class="btn-neutral" id="btn-add-row">+ Add Row</button>
    <button class="btn-neutral" id="btn-clear-row">Clear Row</button>
    <button class="btn-neutral" id="btn-save">Save</button>
    <button class="btn-danger"  id="btn-clear-all">Clear All</button>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:36px;" class="center">#</th>
        <th style="width:20px;" class="center"></th>
        <th style="min-width:110px;">Task Label</th>
        <th style="min-width:130px;">Name</th>
        <th style="min-width:200px;">Description</th>
        <th style="min-width:75px;">Clock In</th>
        <th style="min-width:75px;">Clock Out</th>
        <th style="min-width:70px;" class="center">Total</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="footer-bar">
  <div class="footer-totals">
    <div class="totals">Total logged: <span id="total-time">0h 00m</span></div>
    <div class="breakdown-row" id="breakdown-row"></div>
    <div id="dispatch-preview" style="display:none;margin-top:6px;border-top:1px solid var(--border);padding-top:6px;">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span class="breakdown-chip task-count-chip" onclick="api.send('navigate','task-timer')" title="Open Dispatch" style="cursor:pointer;gap:5px;">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;"><circle cx="8" cy="9" r="5.5"/><line x1="8" y1="9" x2="8" y2="5.8"/><line x1="8" y1="9" x2="10.2" y2="10.3"/><line x1="6.5" y1="1.5" x2="9.5" y2="1.5"/><line x1="8" y1="1.5" x2="8" y2="3.5"/></svg>
          <span id="dispatch-count-label">Dispatch</span>
        </span>
        <div id="dispatch-task-chips" style="display:flex;gap:5px;flex-wrap:wrap;"></div>
        <span id="dispatch-break-badge" style="display:none;"></span>
        <span id="dispatch-lunch-badge" style="display:none;"></span>
        <span id="dispatch-open-link"
              onclick="api.send('navigate','task-timer')"
              style="font-family:var(--sans);font-size:11px;color:var(--accent);cursor:pointer;margin-left:auto;opacity:.8;">
          Open →
        </span>
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
    <div class="totals">Entries: <span id="rows-done">0</span> filled · <span id="rows-total">0</span> total</div>
    <div class="session-status" id="session-status"></div>
  </div>
</div>

<script src="../components/settings.js"></script>
<script src="../components/shell.js"></script>
<script>
  let companies = [], currentCompany = null, currentEntryId = null;
  let rowsData = [];          // [{label,name,desc,clock_in,clock_out,total_mins}]
  let selectedIndex = null;
  let autoSaveTimer = null;
  const MIN_ROWS = 5;

  document.getElementById('log-date').valueAsDate = new Date();

  window.addEventListener('DOMContentLoaded', async () => {
    await Shell.init('tracker');
    document.documentElement.style.visibility = '';
    await loadCompanies();

    document.getElementById('company-select').addEventListener('change', onCompanyChange);
    document.getElementById('btn-clock-in').addEventListener('click', clockIn);
    document.getElementById('btn-clock-out').addEventListener('click', clockOut);
    document.getElementById('btn-add-row').addEventListener('click', addRowManually);
    document.getElementById('btn-clear-row').addEventListener('click', clearSelectedRow);
    document.getElementById('btn-save').addEventListener('click', () => saveSession());
    document.getElementById('btn-clear-all').addEventListener('click', () => clearAll());
    document.getElementById('btn-save-session').addEventListener('click', () => saveSession());
    document.getElementById('btn-export-pdf').addEventListener('click', exportPDF);
    document.getElementById('log-date').addEventListener('change', () => { if (currentCompany) loadTodayEntry(); });

    ['log-date','log-notes','input-name','input-desc'].forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.style.userSelect='text'; el.style.webkitUserSelect='text'; }
    });

    // Event delegation for row selection + inline editing
    const tbody = document.getElementById('tbody');
    tbody.addEventListener('click', e => {
      const tr = e.target.closest('tr');
      if (!tr) return;
      selectRow(parseInt(tr.dataset.idx));
    });
    tbody.addEventListener('dblclick', e => {
      const td = e.target.closest('td[data-field]');
      if (!td || !td.classList.contains('editable')) return;
      const tr = td.closest('tr');
      startEdit(td, parseInt(tr.dataset.idx), td.dataset.field);
    });

    window.addEventListener('beforeunload', clearAutoSaveTimer);

    const saved = sessionStorage.getItem('active_company');
    if (saved) {
      try {
        const co = JSON.parse(saved);
        document.getElementById('company-select').value = co.id;
        await onCompanyChange();
        sessionStorage.removeItem('active_company');
      } catch {}
    }

    buildRows();
  });

  // ── Companies ──
  async function loadCompanies() {
    companies = await Store.getCompanies();
    const sel = document.getElementById('company-select');
    sel.innerHTML = '<option value="">— Select Company —</option>';
    companies.forEach(co => {
      const id = Number(co.id);
      if (!id || isNaN(id)) return;
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = co.name || `Company #${id}`;
      sel.appendChild(opt);
    });
  }

  async function onCompanyChange() {
    const id = parseInt(document.getElementById('company-select').value);
    if (!id) { currentCompany = null; clearAutoSaveTimer(); updateHierarchyBar(); return; }
    currentCompany = companies.find(c => parseInt(c.id) === id) || null;
    currentEntryId = null;
    updateHierarchyBar();
    if (!document.getElementById('log-date').value)
      document.getElementById('log-date').valueAsDate = new Date();
    if (currentCompany) { await loadTodayEntry(); startAutoSaveTimer(); }
  }

  function updateHierarchyBar() {
    const bar = document.getElementById('hierarchy-bar');
    if (!currentCompany) { bar.innerHTML=''; return; }
    const co = currentCompany;
    const parts = [];
    if (co.hier_company)  parts.push(`<span class="hier-seg">${co.hier_company}</span>`);
    if (co.hier_project)  parts.push(`<span class="hier-sep">›</span><span class="hier-seg">${co.hier_project}</span>`);
    if (co.hier_platform) parts.push(`<span class="hier-sep">›</span><span class="hier-seg">${co.hier_platform}</span>`);
    if (co.nav_id)        parts.push(`<span class="hier-sep">›</span><span class="hier-navid">${co.nav_id}</span>`);
    bar.innerHTML = parts.length ? parts.join('') : `<span class="hier-seg">${co.name}</span>`;
  }

  async function loadTodayEntry() {
    if (!currentCompany) return;
    const today   = document.getElementById('log-date').value;
    const entries = await api.invoke('entries:list', currentCompany.id);
    const existing = entries.find(e => e.log_date === today);
    if (existing) {
      currentEntryId = existing.id;
      document.getElementById('log-notes').value = existing.session_label || '';
      restoreRows(JSON.parse(existing.rows_json || '[]'));
      document.getElementById('session-status').textContent = 'Session loaded';
      updateTaskChip(existing.id);
    } else {
      currentEntryId = null;
      clearAll(true);
      updateTaskChip(null);
    }
  }

  async function updateTaskChip(entryId) {
    const preview = document.getElementById('dispatch-preview');
    if (!preview) return;
    if (!entryId) { preview.style.display = 'none'; return; }

    const tasks = await api.invoke('tasks:list', entryId);
    const completed = tasks.filter(t => t.item_type === 'task' && t.stopped_at);
    const activeBreak = tasks.find(t => t.item_type === 'break' && !t.stopped_at);
    const activeLunch = tasks.find(t => t.item_type === 'lunch' && !t.stopped_at);

    preview.style.display = 'block';

    // Count label — always show; "Dispatch" when no tasks yet
    const countLabel = document.getElementById('dispatch-count-label');
    countLabel.textContent = completed.length > 0
      ? `${completed.length} task${completed.length === 1 ? '' : 's'}`
      : 'Dispatch';

    // Per-label breakdown chips
    const chipsEl = document.getElementById('dispatch-task-chips');
    if (completed.length > 0) {
      const counts = {};
      completed.forEach(t => { counts[t.label] = (counts[t.label] || 0) + 1; });
      chipsEl.innerHTML = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .map(([l, c]) => `<span class="breakdown-chip">${l}<span class="bc-time">${c > 1 ? ' ×' + c : ''}</span></span>`)
        .join('');
    } else {
      chipsEl.innerHTML = '';
    }

    // Break badge
    const breakBadge = document.getElementById('dispatch-break-badge');
    if (activeBreak) {
      breakBadge.style.display = 'inline-flex';
      breakBadge.className = 'breakdown-chip';
      breakBadge.style.color = 'var(--yellow)';
      breakBadge.textContent = '☕ On break';
    } else {
      breakBadge.style.display = 'none';
    }

    // Lunch badge
    const lunchBadge = document.getElementById('dispatch-lunch-badge');
    if (activeLunch) {
      lunchBadge.style.display = 'inline-flex';
      lunchBadge.className = 'breakdown-chip';
      lunchBadge.style.color = 'var(--yellow)';
      lunchBadge.textContent = '🍽 On lunch';
    } else {
      lunchBadge.style.display = 'none';
    }
  }

  // ── Row data helpers ──
  function emptyRow() { return { label:'', name:'', desc:'', clock_in:'', clock_out:'', total_mins:0 }; }
  function isRowFilled(r) { return !!(r.label || r.name || r.desc || r.clock_in || r.total_mins > 0); }

  // Ensure: minimum MIN_ROWS rows, exactly one trailing empty "buffer" row, no runs of unused empty rows
  function normalizeRows() {
    while (rowsData.length < MIN_ROWS) rowsData.push(emptyRow());
    // Trim extra trailing empty rows beyond a single buffer (never below MIN_ROWS)
    while (rowsData.length > MIN_ROWS) {
      const last = rowsData[rowsData.length-1];
      const secondLast = rowsData[rowsData.length-2];
      if (!isRowFilled(last) && !isRowFilled(secondLast)) rowsData.pop();
      else break;
    }
    // Ensure last row is always an empty buffer row ready for new entries
    if (isRowFilled(rowsData[rowsData.length-1])) rowsData.push(emptyRow());
  }

  // ── Build / render ──
  function buildRows() {
    rowsData = [];
    normalizeRows();
    renderTable();
    updateTotals();
  }

  function renderTable() {
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = rowsData.map((r, idx) => rowHTML(r, idx)).join('');
  }

  function rowHTML(r, idx) {
    const filled = isRowFilled(r);
    const editableText = filled ? 'editable' : '';
    const editableIn    = r.clock_in  ? 'editable' : '';
    const editableOut   = r.clock_out ? 'editable' : '';
    const dotClass = (r.clock_in && !r.clock_out) ? 'status-dot active' : (filled ? 'status-dot done' : 'status-dot');
    const activeCls = selectedIndex === idx ? 'row-active' : '';
    return `<tr data-idx="${idx}" class="${activeCls}">
      <td class="row-num">${String(idx+1).padStart(2,'0')}</td>
      <td style="text-align:center;"><span class="${dotClass}"></span></td>
      <td class="${r.label?'cell-label':'cell-empty'} ${editableText}" data-field="label" title="${filled?'Double-click to edit':''}">${r.label||'—'}</td>
      <td class="${r.name?'cell-text':'cell-empty'} ${editableText}" data-field="name" title="${filled?'Double-click to edit':''}">${r.name||'—'}</td>
      <td class="${r.desc?'cell-desc':'cell-empty'} ${editableText}" data-field="desc" title="${filled?'Double-click to edit':''}">${r.desc||'—'}</td>
      <td class="cell-time ${r.clock_in?'has-time':''} ${editableIn}" data-field="clock_in" title="${r.clock_in?'Double-click to edit':''}">${r.clock_in||'—'}</td>
      <td class="cell-time ${r.clock_out?'has-time':''} ${editableOut}" data-field="clock_out" title="${r.clock_out?'Double-click to edit':''}">${r.clock_out||'—'}</td>
      <td class="cell-duration" data-field="duration">${r.total_mins>0?formatMins(r.total_mins):'—'}</td>
    </tr>`;
  }

  function restoreRows(rows) {
    rowsData = (rows||[]).map(r => ({
      label: r.label||'', name: r.name||'', desc: r.desc||'',
      clock_in: r.clock_in||'', clock_out: r.clock_out||'', total_mins: r.total_mins||0
    }));
    normalizeRows();
    selectedIndex = null;
    renderTable();
    updateTotals();
  }

  function selectRow(idx) {
    selectedIndex = idx;
    document.querySelectorAll('#tbody tr').forEach(tr => {
      tr.classList.toggle('row-active', parseInt(tr.dataset.idx) === idx);
    });
  }

  function nowTime() {
    const n = new Date();
    return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  }

  function formatMins(total) {
    if (total <= 0) return '—';
    const h = Math.floor(total/60), m = total%60;
    return h>0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m`;
  }

  function computeDiffMins(inT, outT) {
    const [ih,im] = inT.split(':').map(Number);
    const [oh,om] = outT.split(':').map(Number);
    let diff = (oh*60+om) - (ih*60+im);
    if (diff < 0) diff += 1440;
    return diff;
  }

  // ── Clock in/out ──
  function clockIn() {
    if (!currentCompany) { Shell.toast('Select a company first.', 'warning'); return; }
    const label = document.getElementById('input-label').value;
    const name  = document.getElementById('input-name').value.trim();
    const desc  = document.getElementById('input-desc').value.trim();
    const t = nowTime();

    let idx = -1;
    if (selectedIndex != null && rowsData[selectedIndex] && !isRowFilled(rowsData[selectedIndex])) idx = selectedIndex;
    if (idx === -1) idx = rowsData.findIndex(r => !isRowFilled(r));
    if (idx === -1) { rowsData.push(emptyRow()); idx = rowsData.length - 1; }

    const row = rowsData[idx];
    row.label = label; row.name = name; row.desc = desc; row.clock_in = t;
    selectedIndex = idx;

    normalizeRows();
    renderTable();
    updateTotals();
    autoSave();
  }

  function clockOut() {
    let idx = -1;
    if (selectedIndex != null && rowsData[selectedIndex] && rowsData[selectedIndex].clock_in && !rowsData[selectedIndex].clock_out) idx = selectedIndex;
    if (idx === -1) idx = rowsData.findIndex(r => r.clock_in && !r.clock_out);
    if (idx === -1) { Shell.toast('No active clock-in found.', 'warning'); return; }

    const row = rowsData[idx];
    const t = nowTime();
    const diff = computeDiffMins(row.clock_in, t);
    row.clock_out = t;
    row.total_mins = (row.total_mins||0) + diff;
    selectedIndex = idx;

    normalizeRows();
    renderTable();
    updateTotals();
    autoSave();
  }

  function addRowManually() {
    rowsData.push(emptyRow());
    normalizeRows();
    renderTable();
  }

  // ── Inline editing ──
  function startEdit(cell, idx, field) {
    const row = rowsData[idx];
    if (!row) return;
    const current = cell.textContent === '—' ? '' : cell.textContent;
    const isTime  = field === 'clock_in' || field === 'clock_out';
    const isLabel = field === 'label';
    const original = cell.innerHTML;

    let input;
    if (isLabel) {
      input = document.createElement('select');
      input.style.cssText = 'font-family:var(--sans);font-size:12px;background:var(--surface-2);color:var(--text-bright);border:1px solid var(--accent);border-radius:4px;width:100%;';
      ['Training','Evaluation','Review','Annotation','QA','Research','Admin','Communication','Other'].forEach(opt => {
        const o = document.createElement('option');
        o.value = opt; o.textContent = opt;
        if (opt === current) o.selected = true;
        input.appendChild(o);
      });
    } else {
      input = document.createElement('input');
      input.type = 'text'; input.value = current;
      if (isTime) {
        input.placeholder = 'HH:MM'; input.maxLength = 5;
        input.addEventListener('input', () => { input.value = input.value.replace(/[^0-9:]/g,''); });
      }
      input.style.cssText = 'font-family:var(--sans);font-size:12px;background:var(--surface-2);color:var(--text-bright);border:1px solid var(--accent);border-radius:4px;width:100%;padding:2px 6px;user-select:text;-webkit-user-select:text;';
    }

    cell.innerHTML = ''; cell.appendChild(input);
    input.focus(); if (input.select) input.select();

    const commit = () => {
      const val = input.value.trim();
      if (isTime) {
        if (!val) { cell.innerHTML = original; return; }
        if (!/^([01]?[0-9]|2[0-3]):[0-5][0-9]$/.test(val)) {
          Shell.toast('Use HH:MM 24-hour format', 'error');
          cell.innerHTML = original; return;
        }
        const [h,m] = val.split(':');
        const norm = `${String(parseInt(h)).padStart(2,'0')}:${m}`;
        row[field] = norm;
        if (row.clock_in && row.clock_out) {
          row.total_mins = computeDiffMins(row.clock_in, row.clock_out);
        }
      } else if (val) {
        row[field] = val;
      } else {
        cell.innerHTML = original; return;
      }
      normalizeRows();
      renderTable();
      updateTotals();
      autoSave();
    };

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter')  { input.removeEventListener('blur', commit); commit(); }
      if (e.key === 'Escape') { cell.innerHTML = original; }
    });
  }

  // ── Totals + breakdown ──
  function updateTotals() {
    let total = 0;
    const byLabel = {};
    rowsData.forEach(r => {
      if (r.total_mins > 0) {
        total += r.total_mins;
        const l = r.label || 'Other';
        byLabel[l] = (byLabel[l]||0) + r.total_mins;
      }
    });
    document.getElementById('total-time').textContent = total>0 ? formatMins(total) : '0h 00m';
    document.getElementById('rows-done').textContent  = rowsData.filter(isRowFilled).length;
    document.getElementById('rows-total').textContent = rowsData.length;

    const breakdownEl = document.getElementById('breakdown-row');
    const entries = Object.entries(byLabel);
    breakdownEl.innerHTML = entries.length
      ? entries.map(([l,m]) => `<span class="breakdown-chip">${l} <span class="bc-time">${formatMins(m)}</span></span>`).join('')
      : '';
  }

  // ── Auto-save timer ──
  function startAutoSaveTimer() {
    clearAutoSaveTimer();
    const secs = parseInt(Settings.get('autoSaveInterval') ?? 60, 10);
    if (!secs || !currentCompany) { updateStatusDot(); return; }
    autoSaveTimer = setInterval(async () => {
      await autoSave(true);
    }, secs * 1000);
    updateStatusDot();
  }

  function clearAutoSaveTimer() {
    if (autoSaveTimer) { clearInterval(autoSaveTimer); autoSaveTimer = null; }
    updateStatusDot();
  }

  function updateStatusDot() {
    const badge = document.getElementById('live-badge');
    if (!badge) return;
    const secs = parseInt(Settings.get('autoSaveInterval') ?? 60, 10);
    const isLive = !!(currentCompany && secs > 0 && autoSaveTimer);
    badge.style.display = isLive ? 'flex' : 'none';
  }

  // Called by shell.js applyAutoSave when user changes the setting
  function onAutoSaveSettingChanged(seconds) {
    startAutoSaveTimer();
  }

  // ── Save / clear ──
  async function autoSave(fromTimer = false) { if (currentCompany) await saveSession(true, fromTimer); }

  async function saveSession(silent=false, fromTimer=false) {
    if (!currentCompany) { if(!silent) Shell.toast('Select a company first.','warning'); return; }
    let total = 0;
    rowsData.forEach(r => total += (r.total_mins||0));
    const entry = {
      id: currentEntryId,
      company_id: currentCompany.id,
      log_date: document.getElementById('log-date').value,
      session_label: document.getElementById('log-notes').value.trim(),
      rows_json: JSON.stringify(rowsData),
      total_mins: total
    };
    const res = await IPC.entries.save(entry);
    if (res.ok) {
      if (!currentEntryId && res.id) currentEntryId = res.id;
      Store.invalidate('entries');
      updateTaskChip(currentEntryId);
      if (!silent) Shell.toast('Session saved.', 'success');
      const label = fromTimer ? `Auto-saved at ${nowTime()}` : `Saved at ${nowTime()}`;
      document.getElementById('session-status').textContent = label;
      // Restore live dot label after a delay if timer is active
      setTimeout(updateStatusDot, 4000);
    } else if (!silent) Shell.toast(res.error || 'Save failed.', 'error');
  }

  function clearSelectedRow() {
    if (selectedIndex == null || !rowsData[selectedIndex]) return;
    rowsData[selectedIndex] = emptyRow();
    normalizeRows();
    renderTable();
    updateTotals();
    autoSave();
  }

  function clearAll(silent=false) {
    if (!silent && !confirm('Clear all entries?')) return;
    rowsData = [];
    normalizeRows();
    selectedIndex = null;
    renderTable();
    updateTotals();
  }

  // ── PDF Export ──
  function exportPDF() {
    if (!currentCompany) { Shell.toast('Select a company first.','warning'); return; }
    const co = currentCompany;
    const date = document.getElementById('log-date').value;
    const note = document.getElementById('log-notes').value;
    const hierParts = [co.hier_company,co.hier_project,co.hier_platform,co.name].filter(Boolean).join(' › ');

    const filledRows = rowsData.filter(r => isRowFilled(r));
    let rows = '', total = 0;
    filledRows.forEach((r, i) => {
      total += r.total_mins||0;
      rows += `<tr><td>${String(i+1).padStart(2,'0')}</td><td>${r.label||''}</td><td>${r.name||''}</td><td>${r.desc||''}</td><td>${r.clock_in||''}</td><td>${r.clock_out||''}</td><td>${formatMins(r.total_mins||0)}</td></tr>`;
    });

    const breakdown = pdfLabelBreakdown(filledRows);
    const bdHtml = breakdown.length >= 2 ? `
      <h2 style="font-size:12px;font-weight:600;color:#374151;margin:20px 0 6px;border-bottom:1px solid #e5e7eb;padding-bottom:4px;">Time by Label</h2>
      <table style="width:260px;">
        <thead><tr><th>Label</th><th style="text-align:right;">Total</th></tr></thead>
        <tbody>${breakdown.map(([lbl,mins])=>`<tr><td>${lbl}</td><td style="text-align:right;font-variant-numeric:tabular-nums;">${formatMins(mins)}</td></tr>`).join('')}</tbody>
      </table>` : '';

    const metaLines = [
      `<div class="meta">${co.job_title||''}${note?' · '+note:''}</div>`,
      co.work_type ? `<div class="meta">Work type: ${co.work_type}</div>` : '',
      co.location  ? `<div class="meta">Location: ${co.location}</div>` : '',
      co.supervisors ? `<div class="meta">Submitted to: ${co.supervisors}</div>` : '',
    ].join('');

    const win = window.open('','_blank');
    win.document.write(`<!DOCTYPE html><html><head><title>Timesheet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body{font-family:Inter,system-ui,sans-serif;font-size:12px;color:#111;padding:40px;max-width:960px;margin:0 auto;}
      h1{font-size:20px;font-weight:600;margin:0 0 3px;}
      .meta{color:#666;font-size:11px;margin-bottom:3px;}
      .hier{font-size:11px;color:#2563eb;margin-bottom:20px;font-weight:500;}
      table{width:100%;border-collapse:collapse;margin-top:12px;}
      th{background:#f1f5f9;border-bottom:2px solid #2563eb;padding:9px 8px;text-align:left;font-size:11px;font-weight:600;color:#374151;}
      td{padding:8px;border-bottom:1px solid #e5e7eb;font-size:12px;}
      .total-row{font-weight:600;background:#f9fafb;}
      .footer{margin-top:32px;color:#9ca3af;font-size:10px;border-top:1px solid #e5e7eb;padding-top:10px;display:flex;justify-content:space-between;}
    </style></head><body>
    <h1>${co.name}</h1>
    ${metaLines}
    <div class="hier">${hierParts}</div>
    <div class="meta">Date: ${date}</div>
    <table>
      <thead><tr><th>#</th><th>Task Label</th><th>Name</th><th>Description</th><th>Clock In</th><th>Clock Out</th><th>Duration</th></tr></thead>
      <tbody>${rows}<tr class="total-row"><td colspan="6" style="text-align:right;padding-right:12px;">Total</td><td>${formatMins(total)}</td></tr></tbody>
    </table>
    ${bdHtml}
    <div class="footer"><span>Generated by Conquered Time · ${new Date().toLocaleString()}</span><span>CONFIDENTIAL</span></div>
    </body></html>`);
    win.document.close(); win.print();
  }

  function pdfLabelBreakdown(rows) {
    const map = {};
    rows.filter(r => r.label).forEach(r => { map[r.label] = (map[r.label]||0) + (r.total_mins||0); });
    return Object.entries(map).sort((a,b) => b[1]-a[1]);
  }

  function onExportPDF() { exportPDF(); }
</script>
</body>
