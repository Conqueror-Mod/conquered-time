<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
<title>Conquered Time — Dashboard</title>
<link rel="stylesheet" href="../styles/design-system.css">
<script src="theme-init.js"></script>
<style>
  .dashboard-outer {
    display: flex;
    flex-direction: column;
    /* Grows to fill tall windows but never shrinks below its content —
       #main-content scrolls on short windows instead of the grid crushing
       the week band / network web to slivers (flex-shrink would let grid
       tracks compress below their content). */
    flex: 1 0 auto;
    gap: 16px;
  }
  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    /* Top row (network + activity) flexes but never crushes below its
       min-height; the week band and quick actions are fixed-size rows. On
       very short windows #main-content scrolls instead (set in dashboard.ts). */
    grid-template-rows: minmax(200px, 1fr) auto auto;
    gap: 16px;
    flex: 1;
    min-height: 0;
  }
  .span-2 { grid-column: span 2; }

  /* Activity list */
  .activity-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }
  .activity-row:last-child { border-bottom: none; }
  .activity-company {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-bright);
    min-width: 120px;
  }
  .activity-date {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    flex: 1;
  }
  .activity-hours {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--yellow);
    font-weight: 400;
  }

  /* Panels fill height */
  .hud-panel.fill {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }
  .hud-panel.fill .hud-panel-body {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    padding: 10px;
  }

  /* Mini web */
  #web-canvas-wrap {
    position: relative;
    width: 100%;
    flex: 1;
    min-height: 0;
  }
  #web-canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  /* Node tooltip — matches the Companies page web */
  #node-tooltip {
    position: absolute;
    background: var(--surface-3);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-bright);
    pointer-events: none;
    z-index: 10;
    display: none;
    box-shadow: var(--shadow-2);
    max-width: 220px;
  }
  .tooltip-name   { font-weight: 600; color: var(--text-white); margin-bottom: 3px; }
  .tooltip-hier   { font-size: 11px; color: var(--accent); margin-bottom: 2px; font-family: var(--mono); }
  .tooltip-detail { font-size: 11px; color: var(--text-muted); }
  .web-hint {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    padding: 6px 0 0;
    flex-shrink: 0;
  }
  .web-panel-body {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 10px;
    min-height: 0;
  }
  .activity-scroll {
    overflow-y: auto;
    height: 100%;
    scrollbar-width: thin;
    scrollbar-color: var(--border-light) transparent;
  }
  .quick-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ── Week band (docs/PLAN-week-view.md — Direction A volume columns) ── */
  .week-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .week-nav-btn {
    font-size: 13px;
    padding: 3px 9px;
    line-height: 1.2;
  }
  .week-range {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-bright);
    min-width: 110px;
    text-align: center;
  }
  .week-total {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    margin-left: 4px;
  }
  #week-cols {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    height: 132px;
  }
  .week-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    height: 100%;
    min-width: 0;
  }
  .week-blk {
    flex-shrink: 0;
    border-radius: 6px;
    margin-top: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.12s;
    overflow: hidden;
  }
  .week-blk:hover { filter: brightness(1.18); }
  .week-day-empty {
    border: 1px dashed var(--border-light);
    border-radius: 7px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 12px;
  }
  #week-axis {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .week-ax {
    flex: 1;
    text-align: center;
    cursor: pointer;
    border-radius: 6px;
    padding: 2px 0;
  }
  .week-ax:hover { background: var(--surface-2); }
  .week-ax .wd { font-family: var(--sans); font-size: 12px; font-weight: 600; }
  .week-ax .wh { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .week-empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 100%;
  }
  .week-empty-glyph {
    font-size: 26px;
    color: var(--accent);
    opacity: 0.55;
    line-height: 1;
  }
  .week-empty-title {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--text-muted);
  }
  .week-empty-cta {
    font-size: 11px;
    padding: 5px 12px;
  }

  /* ── Dashboard module accent colors ── */
  #chip-today::before         { background: #03ecfc; }
  #chip-week::before          { background: #030ffc; }
  #chip-alltime::before       { background: #fc2403; }
  #chip-companies::before     { background: #020a75; }
  #panel-network::before      { background: #2aed07; }
  #panel-activity::before     { background: #f2fa05; }
  #panel-week::before         { background: #03fcb6; }
  #panel-quickactions::before { background: #610030; }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title-block">
    <div class="page-eyebrow">Overview</div>
    <div class="page-title">Dashboard</div>
  </div>
  <div class="page-actions">
    <button class="btn-primary" data-action="navigate" data-arg="tracker" data-tip="Open the Time Tracker to clock in a new work session.">⏱ New Session</button>
    <button class="btn-neutral" data-action="navigate" data-arg="companies" data-tip="Manage your companies and their project/platform hierarchy.">◉ Companies</button>
  </div>
</div>

<!-- Stat chips -->
<div class="stat-grid mb-16" id="stat-grid">
  <div class="stat-chip" id="chip-today">
    <div class="stat-label">Today</div>
    <div class="stat-value" id="stat-today">—</div>
    <div class="stat-delta" id="delta-today"></div>
  </div>
  <div class="stat-chip" id="chip-week">
    <div class="stat-label">This Week</div>
    <div class="stat-value" id="stat-week">—</div>
    <div class="stat-delta" id="delta-week"></div>
    <div class="stat-spark" id="spark-week"></div>
  </div>
  <div class="stat-chip" id="chip-alltime">
    <div class="stat-label">All Time</div>
    <div class="stat-value" id="stat-alltime">—</div>
    <div class="stat-sub">total hours</div>
  </div>
  <div class="stat-chip" id="chip-companies">
    <div class="stat-label">Companies</div>
    <div class="stat-value" id="stat-companies">—</div>
    <div class="stat-sub">active clients</div>
  </div>
</div>

<div class="dashboard-outer">
<div class="dashboard-grid">

  <div class="hud-panel fill" id="panel-network">
    <div class="hud-panel-header">
      <div class="hud-panel-title">Company Network</div>
      <button class="btn-neutral" style="font-size:11px;padding:5px 10px;" data-action="navigate" data-arg="companies" data-tip="Open the full company network view.">View Full →</button>
    </div>
    <div class="web-panel-body">
      <div id="web-canvas-wrap"><canvas id="web-canvas"></canvas>
        <div id="node-tooltip">
          <div class="tooltip-name"   id="tt-name"></div>
          <div class="tooltip-hier"   id="tt-hier"></div>
          <div class="tooltip-detail" id="tt-detail"></div>
        </div>
      </div>
      <div class="web-hint">Click a node to open that company's tracker</div>
    </div>
  </div>

  <div class="hud-panel fill" id="panel-activity">
    <div class="hud-panel-header">
      <div class="hud-panel-title">Recent Activity</div>
      <button class="btn-neutral" style="font-size:11px;padding:5px 10px;" data-action="navigate" data-arg="global-log" data-tip="Open the Global Log — your full session history across all companies.">All Logs →</button>
    </div>
    <div class="hud-panel-body">
      <div class="activity-scroll" id="activity-list">
        <div style="font-family:var(--sans);font-size:12px;color:var(--text-dim);text-align:center;padding:24px 0;">
          No recent sessions
        </div>
      </div>
    </div>
  </div>

  <div class="hud-panel span-2" id="panel-week">
    <div class="hud-panel-header">
      <div class="hud-panel-title">This Week</div>
      <div class="week-nav">
        <button class="btn-neutral week-nav-btn" id="week-prev" data-tip="Previous week" aria-label="Previous week">‹</button>
        <span class="week-range" id="week-range">—</span>
        <button class="btn-neutral week-nav-btn" id="week-next" data-tip="Next week" aria-label="Next week">›</button>
        <button class="btn-neutral week-nav-btn" id="week-today" style="display:none;" data-tip="Jump back to the current week.">This week</button>
        <span class="week-total" id="week-total"></span>
      </div>
    </div>
    <div class="hud-panel-body">
      <div id="week-cols"></div>
      <div id="week-axis"></div>
    </div>
  </div>

  <div class="hud-panel span-2" id="panel-quickactions">
    <div class="hud-panel-header">
      <div class="hud-panel-title">Quick Actions</div>
    </div>
    <div class="hud-panel-body">
      <div class="quick-actions">
        <button class="btn-primary"  data-action="navigate" data-arg="tracker" data-tip="Clock in/out, punch breaks, and log task rows.">⏱ Open Time Tracker</button>
        <button class="btn-violet"   data-action="navigate" data-arg="companies" data-tip="Add or edit companies, projects, platforms, and Navigator IDs.">◉ Manage Companies</button>
        <button class="btn-neutral"  data-action="navigate" data-arg="global-log" data-tip="Browse, filter, and export your full session history.">≡ View Global Log</button>
        <button class="btn-neutral"  id="btn-backup-now" data-tip="Save an encrypted backup of your vault to the Backup Library right now.">⊙ Backup Now</button>
      </div>
    </div>
  </div>

</div>
</div>

<script src="../components/settings.js"></script>
<script src="../components/about.js"></script>
<script src="../components/shell.js"></script>
<script src="../canvas-text.js"></script>
<script src="../row-utils.js"></script>
<script src="../bubble-web.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
