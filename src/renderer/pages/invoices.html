<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
<title>Conquered Time — Invoices</title>
<link rel="stylesheet" href="../styles/design-system.css">
<script src="theme-init.js"></script>
<style>
  .inv-layout { display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; }

  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-1);
    padding: 18px 20px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .panel-h { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-bright); }

  .gen-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 16px; }
  .fg { display: flex; flex-direction: column; gap: 4px; }
  .fg.span-2 { grid-column: span 2; }
  .fg.span-4 { grid-column: span 4; }
  .fg label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .fg input, .fg select, .fg textarea {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text-bright); font-family: var(--sans); font-size: 13px; padding: 8px 10px;
  }
  .fg textarea { resize: vertical; min-height: 40px; }
  .gen-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }

  .warn-banner {
    display: none; align-items: center; gap: 8px;
    background: var(--yellow-dim, rgba(245,158,11,0.1)); border: 1px solid var(--yellow);
    color: var(--yellow); border-radius: var(--radius); padding: 9px 12px; font-size: 12px; margin-bottom: 14px;
  }
  .warn-banner.show { display: flex; }

  /* Ledger */
  .ledger-wrap { flex: 1; min-height: 0; overflow-y: auto; }
  table.ledger { width: 100%; border-collapse: collapse; }
  table.ledger th {
    position: sticky; top: 0; background: var(--surface-2); text-align: left;
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); padding: 9px 10px; border-bottom: 1px solid var(--border);
  }
  table.ledger td { padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--text-bright); }
  table.ledger td.mono, table.ledger th.num { font-family: var(--mono); }
  table.ledger .num { text-align: right; }
  .empty-row td { text-align: center; color: var(--text-muted); font-style: italic; padding: 26px 0; }

  .status-pill { font-size: 10.5px; font-weight: 600; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
  .status-unpaid { color: var(--yellow); border: 1px solid var(--yellow); background: rgba(245,158,11,0.08); }
  .status-paid   { color: var(--green,#22c55e); border: 1px solid var(--green,#22c55e); background: rgba(34,197,94,0.1); }
  .status-void   { color: var(--text-muted); border: 1px solid var(--border); background: var(--surface-2); text-decoration: line-through; }

  .row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .mini-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius); font-size: 11px; padding: 4px 9px; cursor: pointer; font-family: var(--sans);
  }
  .mini-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mini-btn.danger:hover { border-color: var(--red,#ef4444); color: var(--red,#ef4444); }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 100; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-overlay.show { display: flex; }
  .modal-card {
    background: var(--surface-1); border: 1px solid var(--border-light); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-3); width: 100%; max-width: 720px; max-height: 88vh; display: flex; flex-direction: column;
  }
  .modal-card.narrow { max-width: 420px; }
  .modal-hd { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .modal-hd h2 { font-size: 15px; font-weight: 600; color: var(--text-bright); margin: 0; }
  .modal-bd { padding: 18px 20px; overflow-y: auto; }
  .modal-ft { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); }

  /* Preview inner */
  .pv-parties { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
  .pv-lbl { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 3px; }
  .pv-who { font-size: 13px; font-weight: 600; color: var(--text-bright); }
  .pv-addr { font-size: 11px; color: var(--text-muted); white-space: pre-line; margin-top: 2px; }
  .pv-meta { text-align: right; font-size: 11.5px; color: var(--text-muted); }
  .pv-meta b { color: var(--text-bright); }
  table.pv { width: 100%; border-collapse: collapse; margin: 8px 0; }
  table.pv th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.pv td { padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 12px; font-family: var(--mono); }
  table.pv .num { text-align: right; }
  .pv-totals { margin-left: auto; width: 260px; margin-top: 10px; }
  .pv-totals div { display: flex; justify-content: space-between; padding: 3px 8px; font-size: 12.5px; }
  .pv-totals .grand { font-size: 15px; font-weight: 700; color: var(--text-bright); border-top: 2px solid var(--accent); padding-top: 7px; margin-top: 4px; }
  .pv-totals .mono { font-family: var(--mono); }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title-block">
    <div class="page-eyebrow">Billing</div>
    <div class="page-title">Invoices</div>
  </div>
  <div class="page-actions">
    <button class="btn-neutral" id="numbering-btn">Numbering</button>
  </div>
</div>

<div class="inv-layout">

  <!-- Generate -->
  <div class="panel">
    <div class="panel-head"><div class="panel-h">Generate Invoice</div><div class="panel-h" style="color:var(--text-muted)" id="next-number-tag"></div></div>
    <div class="warn-banner" id="billing-warn">
      <span>Add your business details on the Profile page so invoices have a “Bill From” block.</span>
    </div>
    <div class="gen-grid">
      <div class="fg span-2">
        <label for="gen-company">Company</label>
        <select id="gen-company"><option value="">— Select a company —</option></select>
      </div>
      <div class="fg">
        <label for="gen-from">Period From</label>
        <input type="date" id="gen-from">
      </div>
      <div class="fg">
        <label for="gen-to">Period To</label>
        <input type="date" id="gen-to">
      </div>
      <div class="fg">
        <label for="gen-issue">Issue Date</label>
        <input type="date" id="gen-issue">
      </div>
      <div class="fg">
        <label for="gen-terms">Payment Terms</label>
        <select id="gen-terms">
          <option value="">No terms</option>
          <option value="0">Due on receipt</option>
          <option value="7">Net 7</option>
          <option value="14">Net 14</option>
          <option value="30" selected>Net 30</option>
          <option value="45">Net 45</option>
          <option value="60">Net 60</option>
        </select>
      </div>
      <div class="fg">
        <label for="gen-tax">Tax Rate (%)</label>
        <input type="number" id="gen-tax" placeholder="0" step="0.01" min="0" value="0">
      </div>
      <div class="fg">
        <label for="gen-rate-hint">Rate</label>
        <input type="text" id="gen-rate-hint" disabled placeholder="—">
      </div>
      <div class="fg span-4">
        <label for="gen-notes">Notes (optional)</label>
        <textarea id="gen-notes" placeholder="Shown on the invoice, e.g. “Thank you for your business.”"></textarea>
      </div>
    </div>
    <div class="gen-actions">
      <button class="btn-primary" id="gen-preview-btn">Preview Invoice</button>
    </div>
  </div>

  <!-- Ledger -->
  <div class="panel" style="display:flex;flex-direction:column;min-height:0;flex:1;">
    <div class="panel-head"><div class="panel-h">Invoice Ledger</div><div class="panel-h" style="color:var(--text-muted)" id="ledger-count"></div></div>
    <div class="ledger-wrap">
      <table class="ledger">
        <thead>
          <tr>
            <th>Number</th><th>Company</th><th>Period</th><th class="num">Total</th><th>Status</th><th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody id="ledger-tbody">
          <tr class="empty-row"><td colspan="6">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Preview / Issue modal -->
<div class="modal-overlay" id="preview-modal">
  <div class="modal-card">
    <div class="modal-hd"><h2>Invoice Preview</h2><button class="mini-btn" id="preview-close">✕</button></div>
    <div class="modal-bd" id="preview-body"></div>
    <div class="modal-ft">
      <button class="btn-neutral" id="preview-cancel">Cancel</button>
      <button class="btn-primary" id="preview-issue">Issue Invoice</button>
    </div>
  </div>
</div>

<!-- Numbering modal -->
<div class="modal-overlay" id="numbering-modal">
  <div class="modal-card narrow">
    <div class="modal-hd"><h2>Invoice Numbering</h2><button class="mini-btn" id="num-close">✕</button></div>
    <div class="modal-bd">
      <div class="gen-grid" style="grid-template-columns:1fr 1fr;">
        <div class="fg"><label for="num-prefix">Prefix</label><input type="text" id="num-prefix" maxlength="12" placeholder="INV-"></div>
        <div class="fg"><label for="num-next">Next Number</label><input type="number" id="num-next" min="1" step="1"></div>
        <div class="fg span-2" style="grid-column:span 2;"><label>Preview</label><input type="text" id="num-preview" disabled></div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn-neutral" id="num-cancel">Cancel</button>
      <button class="btn-primary" id="num-save">Save</button>
    </div>
  </div>
</div>

<script src="../components/settings.js"></script>
<script src="../components/about.js"></script>
<script src="../components/shell.js"></script>
<script src="../row-utils.js"></script>
<script src="invoices.js"></script>
</body>
</html>
