<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="40%" cy="32%" r="70%">
      <stop offset="0%"  stop-color="#12122a"/>
      <stop offset="60%" stop-color="#07070f"/>
      <stop offset="100%" stop-color="#020204"/>
    </radialGradient>

    <!-- Sand fill gradients -->
    <linearGradient id="sand-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sand-bot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Waist glow -->
    <radialGradient id="waist-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fde68a" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="stream-glow" x="-300%" y="-10%" width="700%" height="120%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip to upper hourglass triangle -->
    <clipPath id="clip-top">
      <polygon points="144,96 368,96 256,252"/>
    </clipPath>
    <!-- Clip to lower hourglass triangle -->
    <clipPath id="clip-bot">
      <polygon points="256,260 368,416 144,416"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="242" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.18"/>

  <!-- ── Upper bulb: sand remaining in top (roughly 55% full, draining) ── -->
  <!-- Sand sits at the bottom of the upper triangle; empty space above -->
  <!-- Upper empty region is just the dark background showing through -->
  <!-- Sand level line: y=186 cuts across upper triangle at ~55% from top -->
  <g clip-path="url(#clip-top)">
    <!-- Empty upper portion — nothing needed, bg shows through -->
    <!-- Sand fill from level line down to waist -->
    <rect x="100" y="172" width="312" height="90" fill="url(#sand-top)" opacity="0.90"/>
    <!-- Soft curved top edge of the sand (meniscus) -->
    <ellipse cx="256" cy="172" rx="74" ry="10" fill="#fde68a" opacity="0.80"/>
  </g>

  <!-- ── Lower bulb: sand pile accumulated at bottom (~45% full) ── -->
  <g clip-path="url(#clip-bot)">
    <!-- Sand fill from bottom up to pile height -->
    <rect x="100" y="322" width="312" height="100" fill="url(#sand-bot)" opacity="0.90"/>
    <!-- Curved top of the sand pile -->
    <ellipse cx="256" cy="322" rx="88" ry="12" fill="#fde68a" opacity="0.78"/>
  </g>

  <!-- ── Falling sand stream through waist ── -->
  <!-- Thin vertical stream — glow + sharp line -->
  <rect x="250" y="248" width="12" height="80" rx="6"
        fill="#fde68a" opacity="0.30" filter="url(#stream-glow)"/>
  <rect x="253" y="252" width="6" height="72" rx="3"
        fill="#fde68a" opacity="0.85"/>

  <!-- ── Hourglass frame outline ── -->
  <!-- Depth shadow -->
  <path d="M136 88 L376 88 L256 256 L376 424 L136 424 L256 256 Z"
        fill="none" stroke="#78350f" stroke-width="16"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bright outline -->
  <path d="M136 88 L376 88 L256 256 L376 424 L136 424 L256 256 Z"
        fill="none" stroke="#fde68a" stroke-width="7"
        stroke-linejoin="round" stroke-linecap="round"
        filter="url(#soft)" opacity="0.90"/>

  <!-- Cap bars -->
  <rect x="128" y="82"  width="256" height="16" rx="8" fill="#fde68a" opacity="0.95" filter="url(#soft)"/>
  <rect x="128" y="414" width="256" height="16" rx="8" fill="#fde68a" opacity="0.95" filter="url(#soft)"/>

  <!-- Waist glow -->
  <circle cx="256" cy="256" r="52" fill="url(#waist-glow)"/>

  <!-- Waist node -->
  <circle cx="256" cy="256" r="8"  fill="#fde68a" filter="url(#glow)" opacity="0.95"/>
  <circle cx="256" cy="256" r="4.5" fill="white"/>
</svg>
